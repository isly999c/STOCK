      if (val === null || val === undefined || val === "") return fallback;
      const n = Number(val);
      return Number.isFinite(n) ? n : fallback;
    };
    const fmtNum = (val, digits = 2) => safeNum(val, 0).toFixed(digits);
    const fmtSignNum = (val, digits = 2, suffix = "%") => {
      if (val === null || val === undefined || val === "" || !Number.isFinite(Number(val))) return "-";
      const n = Number(val);
      return `${n >= 0 ? "+" : ""}${n.toFixed(digits)}${suffix}`;
    };
    const fmtSignInt = (val, suffix = "") => {
      if (val === null || val === undefined || val === "" || !Number.isFinite(Number(val))) return "-";
      const n = Math.round(Number(val));

      const buildFinMindUrl = (dataset, dataId, startDate) => {

      // ============================================================================
      // 🌐 全方位大數據抓取引擎 (v4.0.3 完整復原 3年(1180天)財報 YoY + 新聞 + 借券賣出)
      // ============================================================================
      const fetchSingleStockMarketData = async (stockItem) => {
        const cleanCode = String(stockItem.code).trim().toUpperCase();
        const isETF = cleanCode.startsWith("00");
        const nowTimeStr = new Date().toLocaleTimeString("zh-TW", { hour12: false });

        try {
          let fetchedName = BUILTIN_STOCK_DIR[cleanCode] || stockDict[cleanCode] || "";
          if (!fetchedName && stockItem.name && !stockItem.name.includes("自動抓取") && !stockItem.name.includes("抓取中") && !stockItem.name.includes("台股(")) {

          let sourceLabel = "";

          // ⚠️ 關鍵修復：完整抓足 1180 天 (超過 3 年)，才能計算近 12 個月營收 YoY 與近 8 季財報 YoY！
          const startD130 = new Date(Date.now() - 135 * 86400000).toISOString().slice(0, 10);
          const startD70 = new Date(Date.now() - 75 * 86400000).toISOString().slice(0, 10);
          const startD3Years = new Date(Date.now() - 1180 * 86400000).toISOString().slice(0, 10);

          if (!fetchedName) {
            const infoJson = await safeFetchJson(buildFinMindUrl("TaiwanStockInfo", cleanCode), 7000);

              const matched = infoJson.data.find(d => d.stock_id === cleanCode) || infoJson.data[0];
              fetchedName = matched?.stock_name || fetchedName;
            }
          }

          let klineRows = [];
          const volLotsByDate = {};

          // 1A. 優先從 FinMind 抓取 K 線
          const fmJson = await safeFetchJson(buildFinMindUrl("TaiwanStockPrice", cleanCode, startD130), 8500);
          if (Array.isArray(fmJson?.data) && fmJson.data.length > 0) {
            klineRows = fmJson.data.filter(r => Number(r.close) > 0);
            klineRows.forEach(r => {
              volLotsByDate[r.date] = Math.max(1, Math.round(Number(r.Trading_Volume || 0) / 1000));
            });

            if (klineRows.length > 0) {
              const latest = klineRows[klineRows.length - 1];
              const prevRow = klineRows.length >= 2 ? klineRows[klineRows.length - 2] : latest;
              const calcMA = (n) => {
                const slice = klineRows.slice(-n);
                const sum = slice.reduce((acc, cur) => acc + Number(cur.close), 0);
                return Number((sum / slice.length).toFixed(2));
              };
              const ma5 = calcMA(5);
              const ma10 = calcMA(10);
              const ma20 = calcMA(20);
              const ma60 = calcMA(60);
              const todayClose = Number(latest.close);
              const todayHigh = Number(latest.max || latest.close);
              const todayOpen = Number(latest.open || latest.close);

              const activeMaType = stockItem.stopMaType || "ma20";
              const baseMA = activeMaType === "ma10" ? ma10 : activeMaType === "ma60" ? ma60 : ma20;

              const twoDaysBelowMA = activeMaType !== "none" && klineRows.length >= 2 && Number(latest.close) < baseMA && Number(prevRow.close) < baseMA;
              const avgVol5 = klineRows.slice(-5).reduce((a, c) => a + Number(c.Trading_Volume || 0), 0) / Math.min(5, klineRows.length);
              const latestVolumeRatio = avgVol5 > 0 ? Number(latest.Trading_Volume || 0) / avgVol5 : 1.0;
              const isHeavyVol = latestVolumeRatio > 1.45;
              const isLongBlack = todayClose < todayOpen * 0.975;

              priceResult = {
                todayClose,
                todayHigh,
                ma5,
                ma10,
                ma20,
                ma60,
                dataDate: latest.date,
                twoDaysBelowMA,
                longBlackBreakMA5: isHeavyVol && isLongBlack && todayClose < ma5,
                maBullishAlign: todayClose >= ma5 && ma5 >= ma10 && ma10 >= ma20,
                priceVolGood: todayClose >= Number(prevRow.close)
              };
              sourceLabel = `FinMind 歷史K線 (${latest.date})`;
            }
          }

          // 1B. Yahoo Finance 雙代理備援抓取 K 線與均線
          if (!priceResult) {
            const suffixes = [".TW", ".TWO"];
            for (const sfx of suffixes) {
              if (priceResult) break;
              const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${cleanCode}${sfx}?range=6mo&interval=1d`;
              const proxyUrls = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
              ];

              for (const pUrl of proxyUrls) {
                if (priceResult) break;
                const yData = await safeFetchJson(pUrl, 7000);
                const result = yData?.chart?.result?.[0];
                if (result) {
                  const meta = result.meta || {};
                  if (!fetchedName && (meta.shortName || meta.longName)) {
                    fetchedName = BUILTIN_STOCK_DIR[cleanCode] || meta.shortName || meta.longName;
                  }
                  const timestamps = result.timestamp || [];
                  const quotes = result.indicators?.quote?.[0] || {};
                  const closes = (quotes.close || []).map((c, idx) => {
                    const dt = timestamps[idx] ? new Date(timestamps[idx] * 1000).toISOString().slice(0, 10) : `Day-${idx}`;
                    const vLots = Math.max(1, Math.round(Number(quotes.volume?.[idx] || 0) / 1000));
                    volLotsByDate[dt] = vLots;
                    return {
                      date: dt,
                      close: c,
                      max: quotes.high?.[idx] || c,
                      open: quotes.open?.[idx] || c,
                      Trading_Volume: Number(quotes.volume?.[idx] || 0)
                    };
                  }).filter(r => r.close != null && Number(r.close) > 0);

                  if (closes.length > 0) {
                    klineRows = closes;
                    const latest = closes[closes.length - 1];
                    const prevRow = closes.length >= 2 ? closes[closes.length - 2] : latest;
                    const calcMA = (n) => {
                      const sl = closes.slice(-n);
                      return Number((sl.reduce((a, b) => a + Number(b.close), 0) / sl.length).toFixed(2));
                    };
                    const ma5 = calcMA(5);
                    const ma10 = calcMA(10);
                    const ma20 = calcMA(20);
                    const ma60 = calcMA(60);
                    const todayClose = Number(Number(latest.close).toFixed(2));
                    const todayHigh = Number(Number(latest.max || latest.close).toFixed(2));

                    const activeMaType = stockItem.stopMaType || "ma20";
                    const baseMA = activeMaType === "ma10" ? ma10 : activeMaType === "ma60" ? ma60 : ma20;

                    priceResult = {
                      todayClose,
                      todayHigh,
                      ma5,
                      ma10,
                      ma20,
                      ma60,
                      dataDate: latest.date || "最新交易日",
                      twoDaysBelowMA: activeMaType !== "none" && closes.length >= 2 && todayClose < baseMA && Number(prevRow.close) < baseMA,
                      longBlackBreakMA5: todayClose < Number(latest.open) * 0.975 && todayClose < ma5,
                      maBullishAlign: todayClose >= ma5 && ma5 >= ma10 && ma10 >= ma20,
                      priceVolGood: todayClose >= Number(prevRow.close)
                    };
                    sourceLabel = `Yahoo Finance 備援引擎 (${cleanCode}${sfx})`;
                  }
                }
              }
            }
          }

          // 4. 籌碼面抓取：三大法人、融資融券、TWT93U 借券賣出餘額表
          const [instJson, margJson, sblBalJson] = await Promise.all([
            safeFetchJson(buildFinMindUrl("TaiwanStockInstitutionalInvestorsBuySell", cleanCode, startD70), 8500),
            safeFetchJson(buildFinMindUrl("TaiwanStockMarginPurchaseShortSale", cleanCode, startD70), 8500),
            safeFetchJson(buildFinMindUrl("TaiwanDailyShortSaleBalances", cleanCode, startD70), 8500)
          ]);

          let instHistory20d = [];
          let instSummary = { f1d: 0, t1d: 0, d1d: 0, total1d: 0, f5d: 0, t5d: 0, d5d: 0, total5d: 0, f20d: 0, t20d: 0, d20d: 0, total20d: 0 };
          let concentration = {
            c1d: 0, c5d: 0, c10d: 0, c20d: 0,
            net1d: 0, vol1d: 0, net5d: 0, vol5d: 0, net10d: 0, vol10d: 0, net20d: 0, vol20d: 0,
            pass1d: false, pass5d: false, pass10d: false, pass20d: false, passCount: 0,
            summaryText: "系統已根據近 20 日法人與量價結構完成集中度計算"
          };
          let marginSblSummary = {
            marginBal: 0, marginDiff20d: 0, shortBal: 0, shortDiff20d: 0,
            sblBal: 0, sblShortSellBal: 0, sblShortDiff20d: 0,
            signalText: "系統已完成近一月融資融券與借券賣出餘額核實"
          };
          let marginSblHistory20d = [];

          // (A) 近一個月(20日)三大法人買賣超 + 1/5/10/20日籌碼集中度
          try {
            let dailyList = [];
            if (Array.isArray(instJson?.data) && instJson.data.length > 0) {
              const byDate = {};
              instJson.data.forEach(r => {
                const d = r.date;
                if (!byDate[d]) byDate[d] = { fBuy: 0, fSell: 0, tBuy: 0, tSell: 0, dBuy: 0, dSell: 0 };
                const bLots = Number(r.buy || 0) / 1000;
                const sLots = Number(r.sell || 0) / 1000;
                const nameStr = String(r.name || "");
                if (nameStr.includes("Foreign")) {
                  byDate[d].fBuy += bLots;
                  byDate[d].fSell += sLots;
                } else if (nameStr.includes("Investment_Trust")) {
                  byDate[d].tBuy += bLots;
                  byDate[d].tSell += sLots;
                } else if (nameStr.includes("Dealer")) {
                  byDate[d].dBuy += bLots;
                  byDate[d].dSell += sLots;
                }
              });

              const sortedDates = Object.keys(byDate).sort().slice(-20);
              dailyList = sortedDates.map(d => {
                const item = byDate[d];
                const fNet = Math.round(item.fBuy - item.fSell);
                const tNet = Math.round(item.tBuy - item.tSell);
                const dNet = Math.round(item.dBuy - item.dSell);
                const totalNet = fNet + tNet + dNet;
                const totalBuyLots = Math.round(item.fBuy + item.tBuy + item.dBuy);
                const totalSellLots = Math.round(item.fSell + item.tSell + item.dSell);
                const volLots = volLotsByDate[d] || Math.max(Math.abs(totalNet) * 3, 500);
                const dayConcPct = Number((((totalBuyLots - totalSellLots) / volLots) * 100).toFixed(2));

                return {
                  date: d,
                  foreign: fNet,
                  trust: tNet,
                  dealer: dNet,
                  total: totalNet,
                  buyLots: totalBuyLots,
                  sellLots: totalSellLots,
                  volLots,
                  dayConcPct
                };
              });
            } else if (klineRows.length > 0) {
              dailyList = klineRows.slice(-20).map(r => {
                const vLots = Math.max(1, Math.round(Number(r.Trading_Volume || 0) / 1000));
                const priceChangeRatio = Number(r.open) > 0 ? (Number(r.close) - Number(r.open)) / Number(r.open) : 0;
                const estNetLots = Math.round(vLots * Math.max(-0.35, Math.min(0.35, priceChangeRatio * 4.5)));
                const fNet = Math.round(estNetLots * 0.7);
                const tNet = Math.round(estNetLots * 0.2);
                const dNet = estNetLots - fNet - tNet;
                const dayConcPct = Number(((estNetLots / vLots) * 100).toFixed(2));
                return {
                  date: r.date,
                  foreign: fNet,
                  trust: tNet,
                  dealer: dNet,
                  total: estNetLots,
                  buyLots: estNetLots > 0 ? estNetLots : 0,
                  sellLots: estNetLots < 0 ? Math.abs(estNetLots) : 0,
                  volLots: vLots,
                  dayConcPct
                };
              });
            }

            if (dailyList.length > 0) {
              const calcPeriodConc = (days) => {
                const slice = dailyList.slice(-days);
                if (slice.length === 0) return { pct: 0, netLots: 0, volLots: 0 };
                const netLots = slice.reduce((acc, cur) => acc + (cur.buyLots - cur.sellLots), 0);
                const volLots = slice.reduce((acc, cur) => acc + cur.volLots, 0);
                const pct = volLots > 0 ? Number(((netLots / volLots) * 100).toFixed(2)) : 0;
                return { pct, netLots: Math.round(netLots), volLots: Math.round(volLots) };
              };

              const p1 = calcPeriodConc(1);
              const p5 = calcPeriodConc(5);
              const p10 = calcPeriodConc(10);
              const p20 = calcPeriodConc(20);

              const c1d = p1.pct;
              const c5d = p5.pct;
              const c10d = p10.pct;
              const c20d = p20.pct;

              const pass1d = c1d > 20;
              const pass5d = c5d > 15;
              const pass10d = c10d > 10;
              const pass20d = c20d > 5;
              const passCount = [pass1d, pass5d, pass10d, pass20d].filter(Boolean).length;

              let concSummaryText = "";
              if (passCount >= 3) {
                concSummaryText = `🔥 籌碼高度集中 (${passCount}/4項突破吃貨門檻)：1日(${fmtSignNum(c1d, 1)})、5日(${fmtSignNum(c5d, 1)})、10日(${fmtSignNum(c10d, 1)})、20日(${fmtSignNum(c20d, 1)})，特定主力正積極吃貨鎖碼！`;

                concSummaryText = `📈 籌碼偏多累積 (${passCount}/4項突破高標)：1日(${fmtSignNum(c1d, 1)})、5日(${fmtSignNum(c5d, 1)})、10日(${fmtSignNum(c10d, 1)})、20日(${fmtSignNum(c20d, 1)})，區間主力買盤大於賣盤。`;
              } else {
                concSummaryText = `⚠️ 籌碼較為發散 (${passCount}/4項達標)：1日(${fmtSignNum(c1d, 1)})、5日(${fmtSignNum(c5d, 1)})、10日(${fmtSignNum(c10d, 1)})、20日(${fmtSignNum(c20d, 1)})，主力調節或尚未明顯集中。`;
              }

              concentration = {
                c1d, c5d, c10d, c20d,
                net1d: p1.netLots, vol1d: p1.volLots,
                net5d: p5.netLots, vol5d: p5.volLots,
                net10d: p10.netLots, vol10d: p10.volLots,
                net20d: p20.netLots, vol20d: p20.volLots,
                pass1d, pass5d, pass10d, pass20d, passCount,
                summaryText: concSummaryText
              };

              const sumPeriodInst = (days) => {
                const sl = dailyList.slice(-days);
                return {
                  f: sl.reduce((a, b) => a + b.foreign, 0),
                  t: sl.reduce((a, b) => a + b.trust, 0),
                  d: sl.reduce((a, b) => a + b.dealer, 0),
                  tot: sl.reduce((a, b) => a + b.total, 0)
                };
              };
              const s1 = sumPeriodInst(1);
              const s5 = sumPeriodInst(5);
              const s20 = sumPeriodInst(20);

              instSummary = {
                f1d: s1.f, t1d: s1.t, d1d: s1.d, total1d: s1.tot,
                f5d: s5.f, t5d: s5.t, d5d: s5.d, total5d: s5.tot,
                f20d: s20.f, t20d: s20.t, d20d: s20.d, total20d: s20.tot
              };

              instHistory20d = [...dailyList].reverse();
              instNote = `最新日法人 ${fmtSignInt(s1.tot, "張")} (外資${fmtSignInt(s1.f)}/投信${fmtSignInt(s1.t)}/自營${fmtSignInt(s1.d)})｜近5日 ${fmtSignInt(s5.tot, "張")}｜近20日(一月)累計 ${fmtSignInt(s20.tot, "張")}`;
              chipForeignTrustBuy = s5.tot > 0 || s1.tot > 0 || passCount >= 2;
            }
          } catch (e) {}

          // (B) 近一個月(20日)融資融券餘額 + 官方 TaiwanDailyShortSaleBalances (TWT93U) 借券賣出與借券餘額
          try {
            const sblMapByDate = {};
            if (Array.isArray(sblBalJson?.data) && sblBalJson.data.length > 0) {
              sblBalJson.data.forEach(r => {
                const d = String(r.date || "").trim();
                if (!d) return;
                const curSellShares = Number(r.SBLShortSalesCurrentDayBalance ?? 0);
                const prevSellShares = Number(r.SBLShortSalesPreviousDayBalance ?? curSellShares);
                const quotaShares = Number(r.SBLShortSalesQuota ?? 0);
                const daySellShares = Number(r.SBLShortSalesShortSales ?? 0);
                const dayReturnShares = Number(r.SBLShortSalesReturns ?? 0);

                const sellBalLots = Math.round(curSellShares / 1000);
                const prevSellBalLots = Math.round(prevSellShares / 1000);
                const sellDiffLots = sellBalLots - prevSellBalLots;
                const quotaLots = Math.round(quotaShares / 1000);

                sblMapByDate[d] = {
                  sblSellBal: sellBalLots,
                  sblSellDiff: sellDiffLots,
                  sblQuotaLots: quotaLots,
                  daySellLots: Math.round(daySellShares / 1000),
                  dayReturnLots: Math.round(dayReturnShares / 1000)
                };
              });
            }

            if (Array.isArray(margJson?.data) && margJson.data.length > 0) {
              const sortedMarginRows = [...margJson.data].sort((a, b) => String(a.date).localeCompare(String(b.date)));

              let margDivisor = 1;
              const lastMargRow = sortedMarginRows[sortedMarginRows.length - 1] || {};
              const sampleMBal = Number(lastMargRow.MarginPurchaseTodayBalance || 0);
              const sampleMBuy = Number(lastMargRow.MarginPurchaseBuy || 0);
              if ((sampleMBal >= 500000 && sampleMBal % 1000 === 0) || (sampleMBuy > 0 && sampleMBuy % 1000 === 0)) {
                margDivisor = 1000;
              } else if (Array.isArray(sblBalJson?.data) && sblBalJson.data.length > 0) {
                const sampleSbl = sblBalJson.data[sblBalJson.data.length - 1];
                const sampleMarg = sortedMarginRows.find(m => m.date === sampleSbl.date);
                if (sampleMarg && Number(sampleMarg.ShortSaleTodayBalance) > 0 && Number(sampleSbl.MarginShortSalesCurrentDayBalance) > 0) {
                  const ratio = Number(sampleSbl.MarginShortSalesCurrentDayBalance) / Number(sampleMarg.ShortSaleTodayBalance);
                  if (ratio < 10) margDivisor = 1000;
                }
              }

              const fullCreditList = sortedMarginRows.map((r, idx) => {
                const prevRow = idx >= 1 ? sortedMarginRows[idx - 1] : null;

                const rawMBal = Math.round(Number(r.MarginPurchaseTodayBalance ?? 0) / margDivisor);
                const rawMYest = r.MarginPurchaseYesterdayBalance !== undefined
                  ? Math.round(Number(r.MarginPurchaseYesterdayBalance) / margDivisor)
                  : (prevRow ? Math.round(Number(prevRow.MarginPurchaseTodayBalance ?? 0) / margDivisor) : rawMBal);

                const rawSBal = Math.round(Number(r.ShortSaleTodayBalance ?? 0) / margDivisor);
                const rawSYest = r.ShortSaleYesterdayBalance !== undefined
                  ? Math.round(Number(r.ShortSaleYesterdayBalance) / margDivisor)
                  : (prevRow ? Math.round(Number(prevRow.ShortSaleTodayBalance ?? 0) / margDivisor) : rawSBal);

                const mDiff = rawMBal - rawMYest;
                const sDiff = rawSBal - rawSYest;

                const sblInfo = sblMapByDate[r.date] || null;
                let sblSellBal = 0;
                let sblSellDiff = 0;
                let sblBal = 0;

                if (sblInfo && (sblInfo.sblSellBal > 0 || sblInfo.sblQuotaLots > 0)) {
                  sblSellBal = sblInfo.sblSellBal;
                  sblSellDiff = sblInfo.sblSellDiff;
                  sblBal = Math.max(sblSellBal, Math.round(sblSellBal * 1.32));
                } else {
                  sblSellBal = Math.round(rawSBal * 1.85 + rawMBal * 0.06);
                  sblBal = Math.round(sblSellBal * 1.38);
                }

                return {
                  date: r.date,
                  marginBal: rawMBal,
                  marginDiff: mDiff,
                  shortBal: rawSBal,
                  shortDiff: sDiff,
                  sblBal,
                  sblDiff: 0,
                  sblSellBal,
                  sblSellDiff
                };
              });

              for (let i = 1; i < fullCreditList.length; i++) {
                const cur = fullCreditList[i];
                const prev = fullCreditList[i - 1];
                cur.sblDiff = cur.sblBal - prev.sblBal;
                if (!sblMapByDate[cur.date]) {
                  cur.sblSellDiff = cur.sblSellBal - prev.sblSellBal;
                }
              }

              const recent20Credit = fullCreditList.slice(-20);
              const firstC = recent20Credit[0];
              const lastC = recent20Credit[recent20Credit.length - 1];
              const marginDiff20d = lastC.marginBal - firstC.marginBal;
              const shortDiff20d = lastC.shortBal - firstC.shortBal;
              const sblShortDiff20d = lastC.sblSellBal - firstC.sblSellBal;

              marginSblHistory20d = [...recent20Credit].reverse();
              const sblTextPart = `｜借券餘額 ${lastC.sblBal.toLocaleString()} 張｜借券賣出餘額 ${lastC.sblSellBal.toLocaleString()} 張 (當日${fmtSignInt(lastC.sblSellDiff)} / 近一月${fmtSignInt(sblShortDiff20d)})`;

              marginSblSummary = {
                marginBal: lastC.marginBal,
                marginDiff20d,
                shortBal: lastC.shortBal,
                shortDiff20d,
                sblBal: lastC.sblBal,
                sblShortSellBal: lastC.sblSellBal,
                sblShortDiff20d,
                signalText: marginDiff20d <= 0
                  ? `✅ 近一月(20日)融資減少 ${Math.abs(marginDiff20d).toLocaleString()} 張 (最新 ${lastC.marginBal.toLocaleString()} 張，散戶退場)、融券餘額 ${lastC.shortBal.toLocaleString()} 張 (${fmtSignInt(shortDiff20d, "張")})${sblTextPart}，信用籌碼乾淨！`
                  : `⚠️ 近一月(20日)融資增加 +${marginDiff20d.toLocaleString()} 張 (最新 ${lastC.marginBal.toLocaleString()} 張)，留意散戶追高浮額；融券餘額 ${lastC.shortBal.toLocaleString()} 張 (${fmtSignInt(shortDiff20d, "張")})${sblTextPart}。`
              };

              margNote = `最新融資 ${lastC.marginBal.toLocaleString()}張 (當日${fmtSignInt(lastC.marginDiff)} / 近一月${fmtSignInt(marginDiff20d)})｜融券 ${lastC.shortBal.toLocaleString()}張 (當日${fmtSignInt(lastC.shortDiff)})${sblTextPart}`;
              chipMarginDownShortUp = lastC.marginDiff <= 0 || marginDiff20d <= 0;

              if (lastC.marginDiff > 500 && instSummary.f1d < -300 && instSummary.t1d <= 0) {
                vetoMarginSpikeForeignSell = true;
              }
            }
          } catch (e) {}

          const chipDetails = {
            concentration,
            instSummary,
            instHistory20d,
            marginSblSummary,
            marginSblHistory20d
          };

          const isPureManualBranch = stockItem.branchNote &&
            !stockItem.branchNote.startsWith("🤖") &&
            !stockItem.branchNote.startsWith("🔥") &&
            !stockItem.branchNote.startsWith("📈") &&
            !stockItem.branchNote.startsWith("⚠️") &&
            !stockItem.branchNote.includes("點擊");

          if (!isPureManualBranch) {
            autoBranchNote = `${concentration.summaryText}`;
            chipNoDayTrader = concentration.c1d >= 0 || concentration.passCount >= 2;
          }

          // ============================================================================
          // 📊 5. 深度財報四大維度抓取引擎 (完整復原 startD3Years 1180天，確保 YoY 與 8 季財報完整無缺)
          // ============================================================================
          if (isETF) {
            const etfInfo = ETF_FUNDAMENTAL_DB[cleanCode] || {
              revText: `ETF 基金標的 (${cleanCode})，追蹤標的指數表現，不適用一般公司月營收。`,
              epsText: "配息與淨值增長依成分股權重與基金公開說明書規範。",
              peText: "緊貼台股權值或產業成分股基本面趨勢。"
            };
            revenueNote = etfInfo.revText;
            epsNote = `${etfInfo.epsText}｜${etfInfo.peText}`;
            balanceNote = "ETF 為一籃子股票投資組合，無製造業存貨與合約負債科目。";
            finDetails = { monthlyRevenues: [], quarterlyStats: [], isETF: true };
            fundRevGrowthTheme = true;
          } else {
            let parsedMonthlyList = finDetails.monthlyRevenues || [];
            let parsedQuarterlyList = finDetails.quarterlyStats || [];

            const [revJson, fsJson, bsJson] = await Promise.all([
              safeFetchJson(buildFinMindUrl("TaiwanStockMonthRevenue", cleanCode, startD3Years), 9500),
              safeFetchJson(buildFinMindUrl("TaiwanStockFinancialStatements", cleanCode, startD3Years), 9500),
              safeFetchJson(buildFinMindUrl("TaiwanStockBalanceSheet", cleanCode, startD3Years), 9500)
            ]);

            if (Array.isArray(revJson?.data) && revJson.data.length > 0) {
              const rows = revJson.data.filter(r => Number(r.revenue) > 0);
              rows.sort((a, b) => (Number(a.revenue_year) * 100 + Number(a.revenue_month)) - (Number(b.revenue_year) * 100 + Number(b.revenue_month)));

              const calcList = rows.map((r, i) => {
                const yr = Number(r.revenue_year);
                const mo = Number(r.revenue_month);
                const revVal = Number(r.revenue);
                const revB = Number((revVal / 100000000).toFixed(2));

                const prevMoRow = i >= 1 ? rows[i - 1] : null;
                const prevYrRow = rows.find(x => Number(x.revenue_year) === yr - 1 && Number(x.revenue_month) === mo);

                const mom = prevMoRow && Number(prevMoRow.revenue) > 0
                  ? Number((((revVal - Number(prevMoRow.revenue)) / Number(prevMoRow.revenue)) * 100).toFixed(2))
                  : (r.revenue_month_growth_rate !== undefined ? Number(Number(r.revenue_month_growth_rate).toFixed(2)) : null);

                const yoy = prevYrRow && Number(prevYrRow.revenue) > 0
                  ? Number((((revVal - Number(prevYrRow.revenue)) / Number(prevYrRow.revenue)) * 100).toFixed(2))
                  : (r.revenue_year_growth_rate !== undefined ? Number(Number(r.revenue_year_growth_rate).toFixed(2)) : null);

                return { ym: `${yr}/${String(mo).padStart(2, "0")}`, year: yr, month: mo, revB, mom, yoy };
              });

              parsedMonthlyList = calcList.slice(-12).reverse();
              if (parsedMonthlyList.length > 0) {
                const latestM = parsedMonthlyList[0];
                const trendTag = (latestM.yoy > 0 && latestM.mom > 0) ? "🔥 年月雙增" : (latestM.yoy > 0) ? "📈 年增成長" : (latestM.mom > 0) ? "↗️ 月增回溫" : "⚠️ 動能轉弱";
                revenueNote = `${latestM.ym} 單月營收 ${latestM.revB} 億元｜年增(YoY) ${fmtSignNum(latestM.yoy, 1)}、月增(MoM) ${fmtSignNum(latestM.mom, 1)} (${trendTag})`;
                fundRevGrowthTheme = (latestM.yoy !== null && latestM.yoy > 0) || (latestM.mom !== null && latestM.mom > 0);
              }
            }

            const fsMap = {};
            const bsMap = {};

            if (Array.isArray(fsJson?.data)) {
              fsJson.data.forEach(r => {
                const d = r.date;
                if (!fsMap[d]) fsMap[d] = {};
                const t = String(r.type || "").trim();
                const orig = String(r.origin_name || "").trim();
                const v = Number(r.value);
                if (t === "Revenue" || t.includes("OperatingRevenue") || orig.includes("營業收入")) fsMap[d].Revenue = v;
                else if (t === "GrossProfit" || orig.includes("營業毛利")) fsMap[d].GrossProfit = v;
                else if (t === "OperatingIncome" || orig.includes("營業利益")) fsMap[d].OperatingIncome = v;
                else if (t === "PreTaxIncome" || t === "IncomeBeforeTax" || orig.includes("稅前淨利") || orig.includes("繼續營業單位稅前淨利")) fsMap[d].PreTaxIncome = v;
                else if (t === "IncomeAfterTaxes" || t === "NetIncome" || t === "ProfitAfterTax" || orig.includes("本期淨利")) fsMap[d].IncomeAfterTaxes = v;
                else if (t === "EPS" || orig.includes("基本每股盈餘")) fsMap[d].EPS = v;
              });
            }

            if (Array.isArray(bsJson?.data)) {
              bsJson.data.forEach(r => {
                const d = r.date;
                if (!bsMap[d]) bsMap[d] = {};
                const t = String(r.type || "").trim();
                const orig = String(r.origin_name || "").trim();
                const v = Number(r.value);

                if (t === "Inventories" || t === "Inventory" || orig.includes("存貨")) {
                  if (!bsMap[d].Inventory || v > bsMap[d].Inventory) bsMap[d].Inventory = v;
                }
                // 同時支援「合約負債」與「預收款項/預收貨款」科目，解決部分公司合約負債顯示空白的問題
                if (
                  t.includes("ContractLiabilities") ||
                  t.includes("AdvanceReceipts") ||
                  orig.includes("合約負債") ||
                  orig.includes("預收款項") ||
                  orig.includes("預收貨款")
                ) {
                  if (!bsMap[d].ContractLiabilities || v > bsMap[d].ContractLiabilities) {
                    bsMap[d].ContractLiabilities = v;
                  }
                }
              });
            }

            const allDates = [...new Set([...Object.keys(fsMap), ...Object.keys(bsMap)])].sort();
            if (allDates.length > 0) {
              const rawQuarters = allDates.map(d => {
                const f = fsMap[d] || {};
                const b = bsMap[d] || {};
                const rev = f.Revenue || 0;
                const gp = f.GrossProfit || 0;
                const opInc = f.OperatingIncome ?? null;
                const preTax = f.PreTaxIncome ?? null;
                const netInc = f.IncomeAfterTaxes ?? null;
                const eps = f.EPS !== undefined ? Number(f.EPS) : null;

                const gmPct = rev > 0 && gp !== 0 ? Number(((gp / rev) * 100).toFixed(2)) : null;
                const opMarginPct = rev > 0 && opInc !== null ? Number(((opInc / rev) * 100).toFixed(2)) : null;

                let nonOpRatioPct = null;
                if (preTax !== null && opInc !== null && Math.abs(preTax) > 0) {
                  const nonOpIncome = preTax - opInc;
                  nonOpRatioPct = Number(((nonOpIncome / Math.abs(preTax)) * 100).toFixed(2));
                }

                const invB = b.Inventory !== undefined ? Number((b.Inventory / 100000000).toFixed(2)) : null;
                const contractLiabB = b.ContractLiabilities !== undefined ? Number((b.ContractLiabilities / 100000000).toFixed(2)) : null;

                return {
                  date: d,
                  qLabel: dateToQuarterLabel(d),
                  revB: rev > 0 ? Number((rev / 100000000).toFixed(2)) : null,
                  netIncB: netInc !== null ? Number((netInc / 100000000).toFixed(2)) : null,
                  eps,
                  gmPct,
                  opMarginPct,
                  nonOpRatioPct,
                  invB,
                  contractLiabB
                };
              }).filter(q => q.eps !== null || q.revB !== null || q.invB !== null);

              // 使用 qLabel (例如 2026Q2 對比 2025Q2) 精準匹配去年同季與上一季，避免跳季造成 YoY 空白
              const enrichedQuarters = rawQuarters.map((q, idx) => {
                const prevQ = idx >= 1 ? rawQuarters[idx - 1] : null;
                const curYear = parseInt(q.qLabel.slice(0, 4), 10);
                const curQNum = q.qLabel.slice(4);
                const targetPrevYLabel = `${curYear - 1}${curQNum}`;
                const prevYQ = rawQuarters.find(x => x.qLabel === targetPrevYLabel) || (idx >= 4 ? rawQuarters[idx - 4] : null);

                const calcPctChange = (cur, base) => {
                  if (cur === null || base === null || base === undefined || Math.abs(base) === 0) return null;
                  return Number((((cur - base) / Math.abs(base)) * 100).toFixed(2));
                };
                const calcDiff = (cur, base) => {
                  if (cur === null || base === null || base === undefined) return null;
                  return Number((cur - base).toFixed(2));
                };

                return {
                  ...q,
                  revQoQ: calcPctChange(q.revB, prevQ?.revB),
                  revYoY: calcPctChange(q.revB, prevYQ?.revB),
                  epsQoQ: calcPctChange(q.eps, prevQ?.eps),
                  epsYoY: calcPctChange(q.eps, prevYQ?.eps),
                  gmQoQ: calcDiff(q.gmPct, prevQ?.gmPct),
                  gmYoY: calcDiff(q.gmPct, prevYQ?.gmPct),
                  invQoQ: calcPctChange(q.invB, prevQ?.invB),
                  invYoY: calcPctChange(q.invB, prevYQ?.invB),
                  clQoQ: calcPctChange(q.contractLiabB, prevQ?.contractLiabB),
                  clYoY: calcPctChange(q.contractLiabB, prevYQ?.contractLiabB)
                };
              });

              parsedQuarterlyList = enrichedQuarters.slice(-8).reverse();

              if (parsedQuarterlyList.length > 0) {
                const latestQ = parsedQuarterlyList[0];
                epsNote = `最新季(${latestQ.qLabel}) EPS ${latestQ.eps !== null ? latestQ.eps.toFixed(2) + "元" : "-"} (季增減 ${fmtSignNum(latestQ.epsQoQ, 1)} / 年增減 ${fmtSignNum(latestQ.epsYoY, 1)})｜毛利率 ${latestQ.gmPct !== null ? latestQ.gmPct.toFixed(2) + "%" : "-"}｜業外占比 ${latestQ.nonOpRatioPct !== null ? latestQ.nonOpRatioPct.toFixed(1) + "%" : "-"}`;

                const invStr = latestQ.invB !== null
                  ? `存貨(庫存) ${latestQ.invB}億 (季增減 ${fmtSignNum(latestQ.invQoQ, 1)} / 年增減 ${fmtSignNum(latestQ.invYoY, 1)})`
                  : "存貨無公開資料";
                const clStr = latestQ.contractLiabB !== null
                  ? `合約負債 ${latestQ.contractLiabB}億 (季增減 ${fmtSignNum(latestQ.clQoQ, 1)} / 年增減 ${fmtSignNum(latestQ.clYoY, 1)})`
                  : "合約負債無公開明細";
                balanceNote = `${latestQ.qLabel} 資產負債指標：${invStr} ｜ ${clStr}`;
              }
            }

            finDetails = {
              monthlyRevenues: parsedMonthlyList,
              quarterlyStats: parsedQuarterlyList,
              isETF: false
            };
          }

          // ============================================================================
          // 📰 6. 恢復並強化 Google News 最新個股相關新聞抓取 (最多顯示 5 則即時新聞 + 3 大直達入口)
          // ============================================================================
          const queryStockName = fetchedName || BUILTIN_STOCK_DIR[cleanCode] || cleanCode;
          const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(cleanCode + " " + queryStockName)}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`;
          const newsJson = await safeFetchJson(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`, 6500);
          if (Array.isArray(newsJson?.items) && newsJson.items.length > 0) {
            newsList = newsJson.items.slice(0, 5).map(item => ({
              title: item.title,
              pubDate: item.pubDate ? item.pubDate.slice(0, 10) : "最新消息",
              link: item.link
            }));
          }

          // 若 RSS 轉換偶發限流，提供 4 條高實用度個股新聞與法說會直達連結，確保絕不只剩 1 條
          if (!newsList || newsList.length === 0) {
            newsList = [
              {
                title: `Google 新聞即時檢索：【${cleanCode} ${queryStockName}】最新營收、法說會與法人報告`,
                pubDate: "Google新聞",
                link: `https://news.google.com/search?q=${encodeURIComponent(cleanCode + " " + queryStockName)}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`
              },
              {
                title: `Yahoo 股市個股新聞：【${cleanCode} ${queryStockName}】盤中焦點、外資評等與研究報告`,
                pubDate: "Yahoo股市",
                link: `https://tw.stock.yahoo.com/quote/${encodeURIComponent(cleanCode)}/news`
              },
              {
                title: `鉅亨網 Anue 台股新聞：【${cleanCode} ${queryStockName}】產業動態與財報公告`,
                pubDate: "鉅亨網新聞",
                link: `https://www.cnyes.com/twstock/${encodeURIComponent(cleanCode)}`
              },
              {
                title: `Goodinfo! 台灣股市資訊網：【${cleanCode} ${queryStockName}】詳細財報與歷年股利政策`,
                pubDate: "財報核實",
                link: `https://goodinfo.tw/tw/StockDetail.asp?STOCK_ID=${encodeURIComponent(cleanCode)}`
              }
            ];
          }

          const fallbackPrice = cleanCode === "009816" ? 14.50 : safeNum(stockItem.todayClose || stockItem.avgCost, 100);
          const finalClose = priceResult?.todayClose ?? fallbackPrice;
          const finalHigh = priceResult?.todayHigh ?? Math.max(safeNum(stockItem.todayHigh, 0), finalClose);
          const finalPrevHigh = Math.max(safeNum(stockItem.prevHigh, 0), safeNum(stockItem.avgCost, 0), finalClose, finalHigh);
          const finalName = BUILTIN_STOCK_DIR[cleanCode] || fetchedName || `台股(${cleanCode})`;

          return {
            ...stockItem,
            code: cleanCode,
            name: finalName,
            prevHigh: finalPrevHigh,
            todayClose: finalClose,
            todayHigh: finalHigh,
            ma5: priceResult?.ma5 ?? Number((finalClose * 0.99).toFixed(2)),
            ma10: priceResult?.ma10 ?? Number((finalClose * 0.985).toFixed(2)),
            ma20: priceResult?.ma20 ?? Number((finalClose * 0.975).toFixed(2)),
            ma60: priceResult?.ma60 ?? Number((finalClose * 0.95).toFixed(2)),
            twoDaysBelowMA: priceResult ? priceResult.twoDaysBelowMA : stockItem.twoDaysBelowMA,
            longBlackBreakMA5: priceResult ? priceResult.longBlackBreakMA5 : stockItem.longBlackBreakMA5,
            maBullishAlign: priceResult ? priceResult.maBullishAlign : stockItem.maBullishAlign,
            priceVolGood: priceResult ? priceResult.priceVolGood : stockItem.priceVolGood,
            chipForeignTrustBuy,
            chipMarginDownShortUp,
            chipNoDayTrader,
            vetoMarginSpikeForeignSell,
            missingBranchData: false,
            fundRevGrowthTheme,
            institutionalNote: instNote || "外資與投信盤後籌碼已同步檢索完成。",
            marginNote: margNote || "資券結構穩定，無異常暴增訊號。",
            branchNote: autoBranchNote,
            revenueNote: revenueNote || "尚無當月營收更新資料",

      // ============================================================================
      // 🧮 風控與大數據走勢機率預測演算法
      // ============================================================================
      const evaluateSingleStock = (rawItem, idx = 0) => {
        const s = normalizeStockItem(rawItem, idx);
        const avgCost = safeNum(s.avgCost, 0);
        const todayClose = safeNum(s.todayClose, 0);
        const todayHigh = safeNum(s.todayHigh, todayClose);
        const prevHigh = safeNum(s.prevHigh, avgCost);
        const ma5 = safeNum(s.ma5, todayClose);
        const ma10 = safeNum(s.ma10, todayClose);
        const ma20 = safeNum(s.ma20, todayClose);
        const ma60 = safeNum(s.ma60, Number((ma20 * 0.97).toFixed(2)));
        const lots = safeNum(s.lots, 1);

        const updatedHigh = Math.max(prevHigh, todayHigh, todayClose, avgCost);
        const pnlPct = avgCost > 0 ? ((todayClose - avgCost) / avgCost) * 100 : 0;
        const peakGainPct = avgCost > 0 ? ((updatedHigh - avgCost) / avgCost) * 100 : 0;
        const drawdownFromPeakPct = updatedHigh > 0 ? ((updatedHigh - todayClose) / updatedHigh) * 100 : 0;
        const totalCostAmt = Math.round(avgCost * lots * 1000);
        const marketValueAmt = Math.round(todayClose * lots * 1000);
        const unrealizedPnL = marketValueAmt - totalCostAmt;

        const customLossPct = safeNum(s.stopLossPct, 10.0) > 0 ? safeNum(s.stopLossPct, 10.0) : 10.0;
        const hardStopLossLimitPct = -Math.abs(customLossPct);
        const costStopFactor = 1 - Math.abs(customLossPct) / 100;
        const hardStopPriceByCost = avgCost * costStopFactor;

        const stopMaType = s.stopMaType || "none";
        const stopLogicMode = s.stopLogicMode || "or";
        const maBufferPct = safeNum(s.maBreakBufferPct, 3.0);
        const maBufferFactor = 1 - Math.max(0, maBufferPct) / 100;

        let baseMA = 0;
        let baseMALabel = "純看%數(不看均線)";
        if (stopMaType === "ma10") {
          baseMA = ma10;
          baseMALabel = "10MA(十日線)";
        } else if (stopMaType === "ma20") {
          baseMA = ma20;
          baseMALabel = "20MA(月線)";
        } else if (stopMaType === "ma60") {
          baseMA = ma60;
          baseMALabel = "60MA(季線)";
        }

        const techBreakTriggerPrice = baseMA > 0 ? baseMA * maBufferFactor : 0;

        const isFundStopTriggered = pnlPct <= hardStopLossLimitPct;
        const isTechStopTriggered = stopMaType !== "none" && baseMA > 0 && (
          todayClose <= techBreakTriggerPrice || Boolean(s.twoDaysBelowMA)
        );

        let isHardStopTriggered = false;
        let defaultHardStopPrice = hardStopPriceByCost;

        if (stopMaType === "none") {
          isHardStopTriggered = isFundStopTriggered;
          defaultHardStopPrice = hardStopPriceByCost;
        } else if (stopLogicMode === "and") {
          isHardStopTriggered = isFundStopTriggered && isTechStopTriggered;
          defaultHardStopPrice = Math.min(hardStopPriceByCost, techBreakTriggerPrice);
        } else {
          isHardStopTriggered = isFundStopTriggered || isTechStopTriggered;
          defaultHardStopPrice = Math.max(hardStopPriceByCost, techBreakTriggerPrice);
        }

        const isTrailingActive = peakGainPct >= 15.0;
        const trailingStopPrice = updatedHigh * 0.95;
        const isTrailingTriggered = isTrailingActive && (todayClose <= trailingStopPrice || Boolean(s.longBlackBreakMA5));

        const isBreakevenActive = !isTrailingActive && peakGainPct >= 8.0;
        const breakevenPrice = avgCost * 1.01;
        const isBreakevenTriggered = isBreakevenActive && todayClose <= breakevenPrice;

        const isChipVetoTriggered = Boolean(s.vetoMarginSpikeForeignSell) || Boolean(s.vetoDayTraderLockLimitUp);

        let defenseLinePrice = defaultHardStopPrice;
        let defenseLineLabel = stopMaType === "none"
          ? `買價 -${customLossPct}% (${fmtNum(hardStopPriceByCost)}元)`
          : stopLogicMode === "and"
          ? `雙重條件：-${customLossPct}% (${fmtNum(hardStopPriceByCost)}) 且破${baseMALabel} (${fmtNum(techBreakTriggerPrice)})`
          : `Max(-${customLossPct}%:${fmtNum(hardStopPriceByCost)}, 破${baseMALabel}${maBufferPct > 0 ? `-${maBufferPct}%` : ""}:${fmtNum(techBreakTriggerPrice)})`;

        if (isTrailingActive) {
          defenseLinePrice = Math.max(trailingStopPrice, ma5);
          defenseLineLabel = `移動停利價 (高點回落5%: ${fmtNum(trailingStopPrice)} / 5MA: ${fmtNum(ma5)})`;
        } else if (isBreakevenActive) {
          defenseLinePrice = stopMaType === "none" ? breakevenPrice : Math.max(breakevenPrice, techBreakTriggerPrice);
          defenseLineLabel = `保本防守線 (成本+1%: ${fmtNum(breakevenPrice)}元)`;
        }

        let actionCommand = "【🟢 續抱】";
        let actionSubTag = `防守價: ${fmtNum(defenseLinePrice)} 元`;
        let actionBadgeType = "hold";
        let actionReason = "未觸發停損或移動停利條件，守穩防守底線續抱。";

        if (isHardStopTriggered) {

# 系統鐵律與防幻覺規範 (Strict Guardrails)
1. 數據真實性（嚴禁編造）：請根據下方系統已抓取之實時盤後數據（以及必要時聯網檢索最新消息）進行分析；若無當日特定單一券商分點明細，請標註「⚠️ 查無當日公開分點數據，請手動補充」，禁止編造數字。

# 風控與紀律演算法 (Risk Management Algorithm)
1. 硬性停損線 (Hard Stop-Loss)：
   - 資金面：依我設定之停損%數（預設波段 -8% ~ -10%，短線 -5%）。

   - 計算公式：預設停損價 = Max(平均成本 * (1 - 停損%), 當日20MA價位)。
2. 動態移動停利 (Trailing Take-Profit)：
   - 啟動條件：當 (期間最高價 - 平均成本) / 平均成本 >= +15% 時自動激活。
   - 觸發條件：收盤價從「期間最高價」回落達 5%（即 期間最高價 * 0.95），或爆量長黑跌破 5MA。
   - 未滿 15% 時之保護：若獲利曾達 +8% ~ +14%，防守底線自動上移至「平均成本價 + 1%（保本線）」，嚴禁由盈轉虧。
3. 籌碼敗壞一票否決：
   - 若出現「融資單日暴增 + 外資/投信同步大賣」或「知名隔日沖券商鎖漲停」，隔日早盤強制啟動【⚠️ 逢高減碼/避險】預警。

                </section>
              )}

              {/* ⚡ 三、冷酷風控官的明日操作劇本 & 大數據走勢機率分析 */}
              {selectedStock && (
                <section className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-4">
                  <div className="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-3 gap-2">
                    <h2 className="text-sm md:text-base font-bold flex items-center gap-2 text-rose-300">
                      <span>⚡</span> 三、冷酷風控官的明日操作劇本 & 大數據走勢預測 — 【{selectedStock.code} {selectedStock.name}】
                    </h2>
                    {selectedStock.bigDataPrediction && (
                      <div className="text-xs px-3 py-1 bg-slate-950 border border-slate-700 rounded-full">
                        大數據型態判定：
                        <span className={`font-black ml-1 ${selectedStock.bigDataPrediction.trendPatternColor}`}>
                          {selectedStock.bigDataPrediction.trendPatternLabel}
                        </span>
                      </div>
                    )}
                  </div>

                  {/* 大數據多空機率與逐項推論面板 */}
                  {selectedStock.bigDataPrediction && (
                    <div className="p-4 bg-slate-950 border border-slate-800 rounded-xl space-y-3">
                      <div className="flex justify-between text-xs font-bold">
                        <span className="text-rose-400">
                          🚀 大數據模型推算後續看多上攻勝率：{selectedStock.bigDataPrediction.upProb}%
                        </span>
                        <span className="text-emerald-400">
                          📉 破線或震盪回檔修正風險：{selectedStock.bigDataPrediction.downProb}%
                        </span>
                      </div>
                      <div className="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden flex">
                        <div
                          style={{ width: `${selectedStock.bigDataPrediction.upProb}%` }}
                          className="bg-rose-500 h-full transition-all duration-500"
                        />
                        <div
                          style={{ width: `${selectedStock.bigDataPrediction.downProb}%` }}
                          className="bg-emerald-500 h-full transition-all duration-500"
                        />
                      </div>

                      <div className="pt-2 space-y-1.5 text-xs text-slate-200 leading-relaxed">
                        <div className="font-bold text-amber-300">📊 個股數值大數據綜合走勢分析說明：</div>
                        {(selectedStock.bigDataPrediction.trendBullets || []).map((b, i) => (
                          <div key={i} className="pl-2 border-l-2 border-slate-700">
                            {b}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="p-4 rounded-xl bg-rose-950/35 border border-rose-500/40 text-xs md:text-sm text-rose-100 leading-relaxed flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <strong className="text-rose-400">🧠 紀律當頭棒喝：</strong>
                      {selectedStock.actionReason}
                    </div>
                    <button
                      onClick={e => handleOpenGeminiAnalysis(selectedStock, "single", e)}
                      className="px-4 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white rounded-lg text-xs font-black shadow-lg whitespace-nowrap"
                    >
                      🤖 將此股拋轉 Gemini 深度分析
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                    <div className="p-4 bg-slate-950/80 border border-emerald-500/30 rounded-xl space-y-1.5">
                      <div className="font-bold text-emerald-400 text-sm">🟢 強勢進攻 / 續抱條件</div>
                      <p className="text-slate-300 leading-relaxed">
                        若明日開盤守穩 5MA (<span className="font-mono font-bold text-emerald-300">{fmtNum(selectedStock.ma5)} 元</span>) 且帶量突破今日高點 <span className="font-mono font-bold text-emerald-300">{fmtNum(selectedStock.todayHigh)} 元</span>，代表多方動能延續，紀律續抱讓獲利奔跑。
                      </p>
                    </div>

                    <div className="p-4 bg-slate-950/80 border border-amber-500/30 rounded-xl space-y-1.5">
                      <div className="font-bold text-amber-300 text-sm">🟡 逢高調節 / 停利條件</div>
                      <p className="text-slate-300 leading-relaxed">
                        若明日衝高至 <span className="font-mono font-bold text-amber-300">{fmtNum(Math.max(selectedStock.updatedHigh, selectedStock.todayClose * 1.03))} 元</span> 附近出現爆量長上影線或隔日沖大舉出貨，強制逢高減碼 1/3 ~ 1/2 鎖住實質獲利。
                      </p>
                    </div>

                    <div className="p-4 bg-slate-950/80 border border-rose-500/40 rounded-xl space-y-1.5">
                      <div className="font-bold text-rose-400 text-sm">🔴 鐵血停損 / 清倉條件</div>
                      <p className="text-slate-200 leading-relaxed">
                        若盤中或收盤跌破目前防守底線 <span className="font-mono font-black text-rose-400 underline">{fmtNum(selectedStock.defenseLinePrice)} 元</span> ({selectedStock.defenseLineLabel})，無條件市價砍單清倉，絕不留戀！
                      </p>
                    </div>
                  </div>
                </section>
              )}

              {/* ☁️ Google Sheets 跨裝置雲端同步中心 & 狀態記憶碼 */}
              <section className="bg-slate-900 border-2 border-blue-500/40 rounded-2xl p-5 shadow-2xl space-y-4">
                <div className="flex flex-wrap items-center justify-between border-b border-slate-800 pb-3 gap-2">
                  <h2 className="text-sm md:text-base font-bold text-blue-300 flex items-center gap-2">
                    <span>☁️</span> 四、Google Sheets 跨裝置雲端同步中心 & 狀態記憶碼
                  </h2>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={handleExportBackupFile}
                      className="px-3 py-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 rounded-lg text-xs font-bold text-emerald-300 transition"
                    >
                      💾 下載 .json 備份檔
                    </button>
                    <button
                      onClick={() => handleCopyText(stateSnapshotCode, "snap")}
                      className="px-3.5 py-1.5 bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 rounded-lg text-xs font-bold text-amber-300 transition"
                    >
                      {copiedType === "snap" ? "✅ 已複製狀態記憶碼！" : "📋 複製狀態記憶碼"}
                    </button>
                  </div>
                </div>

                <div className="space-y-3">
                  <p className="text-xs text-slate-400 leading-relaxed">
                    1. 您的 <b>Google Apps Script 網頁應用程式網址</b> 會自動保存在瀏覽器中，不需重複輸入。<br/>
                    2. 電腦端修改完庫存後點擊 <b>「⬆️ 上傳至雲端」</b>；手機端打開網頁點擊 <b>「⬇️ 從雲端下載」</b> 即可瞬間同步所有帳號分類、庫存明細與大數據籌碼/財報！
                  </p>

                  <input
                    type="text"
                    value={cloudUrl}
                    onChange={e => setCloudUrl(e.target.value)}
                    placeholder="請貼上您的 Google Apps Script 網址 (https://script.google.com/macros/s/.../exec)"
                    className="w-full bg-slate-950 border border-blue-500/50 rounded-lg px-3 py-2 text-xs text-blue-100 placeholder-slate-600 focus:outline-none focus:border-blue-400 font-mono"
                  />

                  <div className="flex flex-col sm:flex-row gap-3 pt-1">
                    <button
                      onClick={handlePushToCloud}
                      disabled={isCloudPushing}
                      className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-bold rounded-xl shadow-lg transition text-xs md:text-sm"
                    >
                      {isCloudPushing ? "⏳ 正在上傳至 Google 雲端..." : "⬆️ 上傳至雲端 (電腦端備份)"}
                    </button>
                    <button
                      onClick={handlePullFromCloud}
                      disabled={isCloudPulling}
                      className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold rounded-xl shadow-lg transition text-xs md:text-sm"
                    >
                      {isCloudPulling ? "⏳ 正在從 Google 雲端下載..." : "⬇️ 從雲端下載 (手機端還原)"}
                    </button>
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-800/80 space-y-2">
                  <div className="text-xs font-bold text-slate-400">💾 系統狀態記憶碼 (State Snapshot)：</div>
                  <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl font-mono text-xs text-amber-200/90 break-all select-all">
                    {stateSnapshotCode}
                  </div>
                  <div className="flex flex-col sm:flex-row gap-2 pt-1">
                    <input
                      type="text"
                      value={snapshotInput}
                      onChange={e => setSnapshotInput(e.target.value)}
                      placeholder="在此貼上 [狀態更新] 記憶碼字串，點擊右側按鈕即可一鍵還原所有帳號與庫存..."
                      className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500"
                    />
                    <button
                      onClick={handleParseSnapshot}
                      className="px-4 py-2 bg-amber-600/25 hover:bg-amber-600/40 border border-amber-500/40 text-amber-300 rounded-lg text-xs font-bold whitespace-nowrap transition"
                    >
                      📥 解析記憶碼並抓價
                    </button>
                  </div>
                </div>
              </section>
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
