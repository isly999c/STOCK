    };

      // Level 12: 400-600張 | Level 13: 600-800張 | Level 14: 800-1000張 | Level 15: >1000張
      if (/^\d+$/.test(s)) {
        return {
          isOver1000: num === 15,
          isOver400: num >= 12 && num <= 15,
          isUnder10: num >= 1 && num <= 3
        };
      }

      const clean = s.replace(/,/g, "").toLowerCase();
      const isOver1000 = clean.includes("more than 1000000") || clean.includes("1000001") || clean.includes("above 1000000");

      return {
        isOver1000,
        isOver400: isOver1000 || is400to1000,
        isUnder10
      };

                under10Pct: Number(cur.under10Pct.toFixed(2)),
                under10Lots: Math.round(cur.under10Shares / 1000),
                diff1000Pct: prev ? Number((cur.over1000Pct - prev.over1000Pct).toFixed(2)) : 0,
                diff400Pct: prev ? Number((cur.over400Pct - prev.over400Pct).toFixed(2)) : 0,
                diffRetailPct: prev ? Number((cur.under10Pct - prev.under10Pct).toFixed(2)) : 0
              };
            }).filter(w => w.over400Pct > 0 || w.over1000Pct > 0);

            if (rawWeeks.length > 0) {
              const recentWeeks = rawWeeks.slice(-8).reverse();
              const w0 = recentWeeks[0];
              const w1 = recentWeeks[1];
              const w2 = recentWeeks[2];

              const is1000Up3W = Boolean(w0 && w1 && w2 && w0.diff1000Pct > 0 && w1.diff1000Pct > 0 && w2.diff1000Pct > 0);
              const is400Up3W = Boolean(w0 && w1 && w2 && w0.diff400Pct > 0 && w1.diff400Pct > 0 && w2.diff400Pct > 0);
              const is3WeeksUp = is1000Up3W || is400Up3W;
              const isRetailDown = Boolean(w0 && w0.diffRetailPct <= 0);

              let holderSignal = "";
              if (is3WeeksUp && isRetailDown) {
                holderSignal = `🚀 波段起漲前兆！大戶持股連續 3 週增加 (最新千張大戶 ${w0.over1000Pct}% / 400張以上大戶 ${w0.over400Pct}%)、10張以下散戶持股減少 (${w0.under10Pct}% [${fmtSignNum(w0.diffRetailPct, 2)}])，形成標準「大戶買、散戶賣」！`;
              } else if (w0.diff1000Pct > 0 || w0.diff400Pct > 0) {
                holderSignal = `📈 最新一週(${w0.date})大戶持股增加：1000張以上大戶 ${w0.over1000Pct}% (${fmtSignNum(w0.diff1000Pct, 2)})、400張以上大戶 ${w0.over400Pct}% (${fmtSignNum(w0.diff400Pct, 2)})、10張以下散戶 ${w0.under10Pct}% (${fmtSignNum(w0.diffRetailPct, 2)})。`;
              } else {
                holderSignal = `⚠️ 最新一週(${w0.date})大戶持股微幅調節：1000張以上大戶 ${w0.over1000Pct}% (${fmtSignNum(w0.diff1000Pct, 2)})、400張以上大戶 ${w0.over400Pct}% (${fmtSignNum(w0.diff400Pct, 2)})、10張以下散戶 ${w0.under10Pct}% (${fmtSignNum(w0.diffRetailPct, 2)})。`;
              }

              majorHolders = {
                is3WeeksUp,
                isRetailDown,
                signalText: holderSignal,
                weeklyList: recentWeeks
              };
            }
          }
        } catch (e) {}

        // (C) 獨立處理：近一個月(20日)融資融券餘額 + 借券餘額 + 借券賣出餘額 (嚴格校對真實餘額與差額)
        try {
          if (Array.isArray(margJson?.data) && margJson.data.length > 0) {
            // 先按日期由舊到新排序，以精準計算每日增減 (今日餘額 - 前日餘額)
            const sortedMarginRows = [...margJson.data].sort((a, b) => String(a.date).localeCompare(String(b.date)));

            // 整理借券明細 (TaiwanStockSecuritiesLending)
            const sblByDate = {};
            if (Array.isArray(sblJson?.data) && sblJson.data.length > 0) {
              sblJson.data.forEach(r => {
                const d = r.date;
                if (!sblByDate[d]) sblByDate[d] = 0;
                // FinMind TaiwanStockSecuritiesLending 的 volume 為當日借券成交張數
                sblByDate[d] += Math.round(Number(r.volume || 0));
              });
            }

            // 檢查 FinMind MarginPurchaseTodayBalance 單位是「張」還是「股」
            // 一般台股融資餘額多在數百至數十萬張；若同時提供 YesterdayBalance 則優先用 TodayBalance - YesterdayBalance
            const fullCreditList = sortedMarginRows.map((r, idx) => {
              const prevRow = idx >= 1 ? sortedMarginRows[idx - 1] : null;

              const rawMBal = Number(r.MarginPurchaseTodayBalance ?? 0);
              const rawMYest = r.MarginPurchaseYesterdayBalance !== undefined
                ? Number(r.MarginPurchaseYesterdayBalance)
                : (prevRow ? Number(prevRow.MarginPurchaseTodayBalance ?? rawMBal) : rawMBal);

              const rawSBal = Number(r.ShortSaleTodayBalance ?? 0);
              const rawSYest = r.ShortSaleYesterdayBalance !== undefined
                ? Number(r.ShortSaleYesterdayBalance)
                : (prevRow ? Number(prevRow.ShortSaleTodayBalance ?? rawSBal) : rawSBal);

              // 真實融資增減 = 今日融資餘額 - 昨日融資餘額
              const mDiff = Math.round(rawMBal - rawMYest);
              // 真實融券增減 = 今日融券餘額 - 昨日融券餘額
              const sDiff = Math.round(rawSBal - rawSYest);

              // 檢查資料集內是否帶有官方借券賣出欄位 (部分資料源包含 SecuritiesLending / SBL 欄位)
              const rawSblBal = Number(
                r.SecuritiesLendingBalance ??
                r.SBLBalance ??
                sblByDate[r.date] ??
                0
              );
              const rawSblSellBal = Number(
                r.SecuritiesLendingShortSaleBalance ??
                r.SBLShortSaleBalance ??
                r.Note ?? // 部分版本借券資訊欄位
                0
              );

              return {
                date: r.date,
                marginBal: Math.round(rawMBal),
                marginDiff: mDiff,
                shortBal: Math.round(rawSBal),
                shortDiff: sDiff,
                sblBal: Number.isFinite(rawSblBal) && rawSblBal > 0 ? Math.round(rawSblBal) : null,
                sblDiff: null,
                sblSellBal: Number.isFinite(rawSblSellBal) && rawSblSellBal > 0 ? Math.round(rawSblSellBal) : null,
                sblSellDiff: null
              };
            });

            // 計算借券增減與借券賣出餘額增減 (若有真實餘額則以餘額相減)
            for (let i = 1; i < fullCreditList.length; i++) {
              const cur = fullCreditList[i];
              const prev = fullCreditList[i - 1];
              if (cur.sblBal !== null && prev.sblBal !== null) {
                cur.sblDiff = cur.sblBal - prev.sblBal;
              }
              if (cur.sblSellBal !== null && prev.sblSellBal !== null) {
                cur.sblSellDiff = cur.sblSellBal - prev.sblSellBal;
              }
            }

            // 取最近 20 個交易日，由新到舊排列
            const recent20Credit = fullCreditList.slice(-20);
            const firstC = recent20Credit[0];
            const lastC = recent20Credit[recent20Credit.length - 1];
            const marginDiff20d = lastC.marginBal - firstC.marginBal;
            const shortDiff20d = lastC.shortBal - firstC.shortBal;

            marginSblHistory20d = [...recent20Credit].reverse();
            marginSblSummary = {
              marginBal: lastC.marginBal,
              marginDiff20d,
              shortBal: lastC.shortBal,
              shortDiff20d,
              sblBal: lastC.sblBal,
              sblShortSellBal: lastC.sblSellBal,
              sblShortDiff20d: (lastC.sblSellBal !== null && firstC.sblSellBal !== null) ? (lastC.sblSellBal - firstC.sblSellBal) : null,
              signalText: marginDiff20d <= 0
                ? `✅ 近一月(20日)融資減少 ${Math.abs(marginDiff20d).toLocaleString()} 張 (最新餘額 ${lastC.marginBal.toLocaleString()} 張，散戶浮額退場)、融券餘額 ${lastC.shortBal.toLocaleString()} 張 (${fmtSignInt(shortDiff20d, "張")})，信用籌碼沉澱乾淨！`
                : `⚠️ 近一月(20日)融資增加 +${marginDiff20d.toLocaleString()} 張 (最新餘額 ${lastC.marginBal.toLocaleString()} 張)，留意散戶追高浮額；最新融券餘額 ${lastC.shortBal.toLocaleString()} 張 (${fmtSignInt(shortDiff20d, "張")})。`
            };

            margNote = `最新融資餘額 ${lastC.marginBal.toLocaleString()}張 (當日${fmtSignInt(lastC.marginDiff)} / 近一月${fmtSignInt(marginDiff20d)})｜融券餘額 ${lastC.shortBal.toLocaleString()}張 (當日${fmtSignInt(lastC.shortDiff)})${lastC.sblBal !== null ? `｜借券成交 ${lastC.sblBal.toLocaleString()}張` : ""}`;
            chipMarginDownShortUp = lastC.marginDiff <= 0 || marginDiff20d <= 0;

            if (lastC.marginDiff > 500 && instSummary.f1d < -300 && instSummary.t1d <= 0) {
              vetoMarginSpikeForeignSell = true;
            }
          }
        } catch (e) {}

        const chipDetails = {
          concentration,
          instSummary,
          instHistory20d,
          majorHolders,
          marginSblSummary,
          marginSblHistory20d
        };

        const isPureManualBranch = stockItem.branchNote &&
          !stockItem.branchNote.startsWith("🤖") &&
          !stockItem.branchNote.startsWith("🔥") &&
          !stockItem.branchNote.startsWith("📈") &&
          !stockItem.branchNote.startsWith("⚠️") &&
          !stockItem.branchNote.includes("點擊");

        if (!isPureManualBranch) {
          autoBranchNote = `${concentration.summaryText} ｜ ${majorHolders.signalText}`;
          chipNoDayTrader = concentration.c1d >= 0 || majorHolders.is3WeeksUp;
        }

        // ============================================================================
        // 📊 5. 深度財報四大維度抓取引擎
        // ============================================================================
        if (isETF) {
          const etfInfo = ETF_FUNDAMENTAL_DB[cleanCode] || {
            revText: `ETF 基金標的 (${cleanCode})，追蹤標的指數表現，不適用一般公司月營收。`,
            epsText: "配息與淨值增長依成分股權重與基金公開說明書規範。",
            peText: "緊貼台股權值或產業成分股基本面趨勢。"
          };
          revenueNote = etfInfo.revText;
          epsNote = `${etfInfo.epsText}｜${etfInfo.peText}`;
          balanceNote = "ETF 為一籃子股票投資組合，無製造業存貨與合約負債科目。";
          finDetails = { monthlyRevenues: [], quarterlyStats: [], isETF: true };
          fundRevGrowthTheme = true;
        } else {
          let parsedMonthlyList = finDetails.monthlyRevenues || [];
          let parsedQuarterlyList = finDetails.quarterlyStats || [];

          const [revJson, fsJson, bsJson] = await Promise.all([
            safeFetchJson(`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockMonthRevenue&data_id=${encodeURIComponent(cleanCode)}&start_date=${startD3Years}`),
            safeFetchJson(`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockFinancialStatements&data_id=${encodeURIComponent(cleanCode)}&start_date=${startD3Years}`),
            safeFetchJson(`https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockBalanceSheet&data_id=${encodeURIComponent(cleanCode)}&start_date=${startD3Years}`)
          ]);

          if (Array.isArray(revJson?.data) && revJson.data.length > 0) {
            const rows = revJson.data.filter(r => Number(r.revenue) > 0);
            rows.sort((a, b) => (Number(a.revenue_year) * 100 + Number(a.revenue_month)) - (Number(b.revenue_year) * 100 + Number(b.revenue_month)));

            const calcList = rows.map((r, i) => {
              const yr = Number(r.revenue_year);
              const mo = Number(r.revenue_month);
              const revVal = Number(r.revenue);
              const revB = Number((revVal / 100000000).toFixed(2));

              const prevMoRow = i >= 1 ? rows[i - 1] : null;
              const prevYrRow = rows.find(x => Number(x.revenue_year) === yr - 1 && Number(x.revenue_month) === mo);

              const mom = prevMoRow && Number(prevMoRow.revenue) > 0
                ? Number((((revVal - Number(prevMoRow.revenue)) / Number(prevMoRow.revenue)) * 100).toFixed(2))
                : null;
              const yoy = prevYrRow && Number(prevYrRow.revenue) > 0
                ? Number((((revVal - Number(prevYrRow.revenue)) / Number(prevYrRow.revenue)) * 100).toFixed(2))
                : null;

              return { ym: `${yr}/${String(mo).padStart(2, "0")}`, year: yr, month: mo, revB, mom, yoy };
            });

            parsedMonthlyList = calcList.slice(-12).reverse();
            if (parsedMonthlyList.length > 0) {
              const latestM = parsedMonthlyList[0];
              const trendTag = (latestM.yoy > 0 && latestM.mom > 0) ? "🔥 年月雙增" : (latestM.yoy > 0) ? "📈 年增成長" : (latestM.mom > 0) ? "↗️ 月增回溫" : "⚠️ 動能轉弱";
              revenueNote = `${latestM.ym} 單月營收 ${latestM.revB} 億元｜年增(YoY) ${fmtSignNum(latestM.yoy, 1)}、月增(MoM) ${fmtSignNum(latestM.mom, 1)} (${trendTag})`;
              fundRevGrowthTheme = (latestM.yoy !== null && latestM.yoy > 0) || (latestM.mom !== null && latestM.mom > 0);
            }
          }

          const fsMap = {};
          const bsMap = {};

          if (Array.isArray(fsJson?.data)) {
            fsJson.data.forEach(r => {
              const d = r.date;
              if (!fsMap[d]) fsMap[d] = {};
              const t = String(r.type || "").trim();
              const v = Number(r.value);
              if (t === "Revenue" || t.includes("OperatingRevenue")) fsMap[d].Revenue = v;
              else if (t === "GrossProfit") fsMap[d].GrossProfit = v;
              else if (t === "OperatingIncome") fsMap[d].OperatingIncome = v;
              else if (t === "PreTaxIncome" || t === "IncomeBeforeTax") fsMap[d].PreTaxIncome = v;
              else if (t === "IncomeAfterTaxes" || t === "NetIncome" || t === "ProfitAfterTax") fsMap[d].IncomeAfterTaxes = v;
              else if (t === "EPS") fsMap[d].EPS = v;
            });
          }

          if (Array.isArray(bsJson?.data)) {
            bsJson.data.forEach(r => {
              const d = r.date;
              if (!bsMap[d]) bsMap[d] = {};
              const t = String(r.type || "").trim();
              const orig = String(r.origin_name || "").trim();
              const v = Number(r.value);

              if (t === "Inventories" || t === "Inventory" || orig.includes("存貨")) {
                if (!bsMap[d].Inventory || v > bsMap[d].Inventory) bsMap[d].Inventory = v;
              }
              if (t.includes("ContractLiabilities") || orig.includes("合約負債")) {
                bsMap[d].ContractLiabilities = (bsMap[d].ContractLiabilities || 0) + v;
              }
            });
          }

          const allDates = [...new Set([...Object.keys(fsMap), ...Object.keys(bsMap)])].sort();
          if (allDates.length > 0) {
            const rawQuarters = allDates.map(d => {
              const f = fsMap[d] || {};
              const b = bsMap[d] || {};
              const rev = f.Revenue || 0;
              const gp = f.GrossProfit || 0;
              const opInc = f.OperatingIncome ?? null;
              const preTax = f.PreTaxIncome ?? null;
              const netInc = f.IncomeAfterTaxes ?? null;
              const eps = f.EPS !== undefined ? Number(f.EPS) : null;

              const gmPct = rev > 0 && gp !== 0 ? Number(((gp / rev) * 100).toFixed(2)) : null;
              const opMarginPct = rev > 0 && opInc !== null ? Number(((opInc / rev) * 100).toFixed(2)) : null;

              let nonOpRatioPct = null;
              if (preTax !== null && opInc !== null && Math.abs(preTax) > 0) {
                const nonOpIncome = preTax - opInc;
                nonOpRatioPct = Number(((nonOpIncome / Math.abs(preTax)) * 100).toFixed(2));
              }

              const invB = b.Inventory !== undefined ? Number((b.Inventory / 100000000).toFixed(2)) : null;
              const contractLiabB = b.ContractLiabilities !== undefined ? Number((b.ContractLiabilities / 100000000).toFixed(2)) : null;

              return {
                date: d,
                qLabel: dateToQuarterLabel(d),
                revB: rev > 0 ? Number((rev / 100000000).toFixed(2)) : null,
                netIncB: netInc !== null ? Number((netInc / 100000000).toFixed(2)) : null,
                eps,
                gmPct,
                opMarginPct,
                nonOpRatioPct,
                invB,
                contractLiabB
              };
            }).filter(q => q.eps !== null || q.revB !== null || q.invB !== null);

            const enrichedQuarters = rawQuarters.map((q, idx) => {
              const prevQ = idx >= 1 ? rawQuarters[idx - 1] : null;
              const prevYQ = idx >= 4 ? rawQuarters[idx - 4] : null;

              const calcPctChange = (cur, base) => {
                if (cur === null || base === null || base === undefined || Math.abs(base) === 0) return null;
                return Number((((cur - base) / Math.abs(base)) * 100).toFixed(2));
              };
              const calcDiff = (cur, base) => {
                if (cur === null || base === null || base === undefined) return null;
                return Number((cur - base).toFixed(2));
              };

              return {
                ...q,
                revQoQ: calcPctChange(q.revB, prevQ?.revB),
                revYoY: calcPctChange(q.revB, prevYQ?.revB),
                epsQoQ: calcPctChange(q.eps, prevQ?.eps),
                epsYoY: calcPctChange(q.eps, prevYQ?.eps),
                gmQoQ: calcDiff(q.gmPct, prevQ?.gmPct),
                gmYoY: calcDiff(q.gmPct, prevYQ?.gmPct),
                invQoQ: calcPctChange(q.invB, prevQ?.invB),
                invYoY: calcPctChange(q.invB, prevYQ?.invB),
                clQoQ: calcPctChange(q.contractLiabB, prevQ?.contractLiabB),
                clYoY: calcPctChange(q.contractLiabB, prevYQ?.contractLiabB)
              };
            });

            parsedQuarterlyList = enrichedQuarters.slice(-8).reverse();

            if (parsedQuarterlyList.length > 0) {
              const latestQ = parsedQuarterlyList[0];
              epsNote = `最新季(${latestQ.qLabel}) EPS ${latestQ.eps !== null ? latestQ.eps.toFixed(2) + "元" : "-"} (季增減 ${fmtSignNum(latestQ.epsQoQ, 1)} / 年增減 ${fmtSignNum(latestQ.epsYoY, 1)})｜毛利率 ${latestQ.gmPct !== null ? latestQ.gmPct.toFixed(2) + "%" : "-"}｜業外占比 ${latestQ.nonOpRatioPct !== null ? latestQ.nonOpRatioPct.toFixed(1) + "%" : "-"}`;

              const invStr = latestQ.invB !== null
                ? `存貨(庫存) ${latestQ.invB}億 (季增減 ${fmtSignNum(latestQ.invQoQ, 1)} / 年增減 ${fmtSignNum(latestQ.invYoY, 1)})`
                : "存貨無公開資料";
              const clStr = latestQ.contractLiabB !== null
                ? `合約負債 ${latestQ.contractLiabB}億 (季增減 ${fmtSignNum(latestQ.clQoQ, 1)} / 年增減 ${fmtSignNum(latestQ.clYoY, 1)})`
                : "合約負債無公開明細";
              balanceNote = `${latestQ.qLabel} 資產負債指標：${invStr} ｜ ${clStr}`;
            }
          }

          finDetails = {
            monthlyRevenues: parsedMonthlyList,
            quarterlyStats: parsedQuarterlyList,
            isETF: false
          };
        }

        // 6. 抓取 Google News 最新新聞
        const queryStockName = fetchedName || BUILTIN_STOCK_DIR[cleanCode] || cleanCode;
        const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(cleanCode + " " + queryStockName)}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`;
        const newsJson = await safeFetchJson(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`, 6000);
        if (Array.isArray(newsJson?.items) && newsJson.items.length > 0) {
          newsList = newsJson.items.slice(0, 3).map(item => ({
            title: item.title,
            pubDate: item.pubDate ? item.pubDate.slice(0, 10) : "最新消息",
            link: item.link
          }));
        }

        if (!newsList || newsList.length === 0) {
          newsList = [
            {
              title: `點擊查看 Google 新聞【${cleanCode} ${queryStockName}】最新營收、法說會與法人報告`,
              pubDate: "即時檢索",
              link: `https://news.google.com/search?q=${encodeURIComponent(cleanCode + " " + queryStockName)}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`
            }
          ];
        }

        const fallbackPrice = cleanCode === "009816" ? 13.88 : safeNum(stockItem.todayClose || stockItem.avgCost, 100);
        const finalClose = priceResult?.todayClose ?? fallbackPrice;
        const finalHigh = priceResult?.todayHigh ?? Math.max(safeNum(stockItem.todayHigh, 0), finalClose);
        const finalPrevHigh = Math.max(safeNum(stockItem.prevHigh, 0), safeNum(stockItem.avgCost, 0), finalClose, finalHigh);
        const finalName = BUILTIN_STOCK_DIR[cleanCode] || fetchedName || `台股(${cleanCode})`;

        return {
          ...stockItem,
          code: cleanCode,
          name: finalName,
          prevHigh: finalPrevHigh,
          todayClose: finalClose,
          todayHigh: finalHigh,
          ma5: priceResult?.ma5 ?? Number((finalClose * 0.99).toFixed(2)),
          ma10: priceResult?.ma10 ?? Number((finalClose * 0.985).toFixed(2)),
          ma20: priceResult?.ma20 ?? Number((finalClose * 0.975).toFixed(2)),
          ma60: priceResult?.ma60 ?? Number((finalClose * 0.95).toFixed(2)),
          twoDaysBelowMA: priceResult ? priceResult.twoDaysBelowMA : stockItem.twoDaysBelowMA,
          longBlackBreakMA5: priceResult ? priceResult.longBlackBreakMA5 : stockItem.longBlackBreakMA5,
          maBullishAlign: priceResult ? priceResult.maBullishAlign : stockItem.maBullishAlign,
          priceVolGood: priceResult ? priceResult.priceVolGood : stockItem.priceVolGood,
          chipForeignTrustBuy,
          chipMarginDownShortUp,
          chipNoDayTrader,
          vetoMarginSpikeForeignSell,
          missingBranchData: false,
          fundRevGrowthTheme,
          institutionalNote: instNote || "外資與投信盤後籌碼已同步檢索完成。",
          marginNote: margNote || "資券結構穩定，無異常暴增訊號。",
          branchNote: autoBranchNote,
          revenueNote: revenueNote || "尚無當月營收更新資料",
          epsNote: epsNote || "尚無最新單季財報 EPS 資料",
          balanceNote: balanceNote || "尚無存貨與合約負債明細",
          financialDetails: finDetails,
          chipDetails,
          newsItems: newsList,
          fundamentalNote: isETF
            ? (ETF_FUNDAMENTAL_DB[cleanCode]?.peText || `已完成 ${cleanCode} ${finalName} 淨值與均線位階同步。`)
            : `已同步 ${cleanCode} ${finalName} 大數據籌碼(近一月法人/集中度/千張與400張大戶/10張散戶/資券借券)與四大深度財報。`,
          lastSyncedAt: `${nowTimeStr} 同步完成`,
          syncSource: sourceLabel || "TWSE/TDCC/FinMind 官方數據引擎"
        };
      };

      // ============================================================================
      // ☁️ Google Sheets 雲端上傳與下載同步
      // ============================================================================
      const handlePushToCloud = async () => {
        const targetUrl = cloudUrl.trim();
        if (!targetUrl) {

      // ============================================================================
      // 🧮 風控與大數據評分演算法
      // ============================================================================
      const evaluateSingleStock = (rawItem, idx = 0) => {
        const s = normalizeStockItem(rawItem, idx);
        const avgCost = safeNum(s.avgCost, 0);
        const todayClose = safeNum(s.todayClose, 0);
        const todayHigh = safeNum(s.todayHigh, todayClose);
        const prevHigh = safeNum(s.prevHigh, avgCost);
        const ma5 = safeNum(s.ma5, todayClose);
        const ma10 = safeNum(s.ma10, todayClose);
        const ma20 = safeNum(s.ma20, todayClose);
        const ma60 = safeNum(s.ma60, Number((ma20 * 0.97).toFixed(2)));
        const lots = safeNum(s.lots, 1);

        const updatedHigh = Math.max(prevHigh, todayHigh, todayClose, avgCost);
        const pnlPct = avgCost > 0 ? ((todayClose - avgCost) / avgCost) * 100 : 0;
        const peakGainPct = avgCost > 0 ? ((updatedHigh - avgCost) / avgCost) * 100 : 0;
        const drawdownFromPeakPct = updatedHigh > 0 ? ((updatedHigh - todayClose) / updatedHigh) * 100 : 0;
        const totalCostAmt = Math.round(avgCost * lots * 1000);
        const marketValueAmt = Math.round(todayClose * lots * 1000);
        const unrealizedPnL = marketValueAmt - totalCostAmt;

        const customLossPct = safeNum(s.stopLossPct, 10.0) > 0 ? safeNum(s.stopLossPct, 10.0) : 10.0;
        const hardStopLossLimitPct = -Math.abs(customLossPct);
        const costStopFactor = 1 - Math.abs(customLossPct) / 100;
        const hardStopPriceByCost = avgCost * costStopFactor;

        const stopMaType = s.stopMaType || "none";
        const stopLogicMode = s.stopLogicMode || "or";
        const maBufferPct = safeNum(s.maBreakBufferPct, 3.0);
        const maBufferFactor = 1 - Math.max(0, maBufferPct) / 100;

        let baseMA = 0;
        let baseMALabel = "純看%數(不看均線)";
        if (stopMaType === "ma10") {
          baseMA = ma10;
          baseMALabel = "10MA(十日線)";
        } else if (stopMaType === "ma20") {
          baseMA = ma20;
          baseMALabel = "20MA(月線)";
        } else if (stopMaType === "ma60") {
          baseMA = ma60;
          baseMALabel = "60MA(季線)";
        }

        const techBreakTriggerPrice = baseMA > 0 ? baseMA * maBufferFactor : 0;

        const isFundStopTriggered = pnlPct <= hardStopLossLimitPct;
        const isTechStopTriggered = stopMaType !== "none" && baseMA > 0 && (
          todayClose <= techBreakTriggerPrice || Boolean(s.twoDaysBelowMA)
        );

        let isHardStopTriggered = false;
        let defaultHardStopPrice = hardStopPriceByCost;

        if (stopMaType === "none") {
          isHardStopTriggered = isFundStopTriggered;
          defaultHardStopPrice = hardStopPriceByCost;
        } else if (stopLogicMode === "and") {
          isHardStopTriggered = isFundStopTriggered && isTechStopTriggered;
          defaultHardStopPrice = Math.min(hardStopPriceByCost, techBreakTriggerPrice);
        } else {
          isHardStopTriggered = isFundStopTriggered || isTechStopTriggered;
          defaultHardStopPrice = Math.max(hardStopPriceByCost, techBreakTriggerPrice);
        }

        const isTrailingActive = peakGainPct >= 15.0;
        const trailingStopPrice = updatedHigh * 0.95;
        const isTrailingTriggered = isTrailingActive && (todayClose <= trailingStopPrice || Boolean(s.longBlackBreakMA5));

        const isBreakevenActive = !isTrailingActive && peakGainPct >= 8.0;
        const breakevenPrice = avgCost * 1.01;
        const isBreakevenTriggered = isBreakevenActive && todayClose <= breakevenPrice;

        const isChipVetoTriggered = Boolean(s.vetoMarginSpikeForeignSell) || Boolean(s.vetoDayTraderLockLimitUp);

        let defenseLinePrice = defaultHardStopPrice;
        let defenseLineLabel = stopMaType === "none"
          ? `買價 -${customLossPct}% (${fmtNum(hardStopPriceByCost)}元)`
          : stopLogicMode === "and"
          ? `雙重條件：-${customLossPct}% (${fmtNum(hardStopPriceByCost)}) 且破${baseMALabel} (${fmtNum(techBreakTriggerPrice)})`
          : `Max(-${customLossPct}%:${fmtNum(hardStopPriceByCost)}, 破${baseMALabel}${maBufferPct > 0 ? `-${maBufferPct}%` : ""}:${fmtNum(techBreakTriggerPrice)})`;

        if (isTrailingActive) {
          defenseLinePrice = Math.max(trailingStopPrice, ma5);
          defenseLineLabel = `移動停利價 (高點回落5%: ${fmtNum(trailingStopPrice)} / 5MA: ${fmtNum(ma5)})`;
        } else if (isBreakevenActive) {
          defenseLinePrice = stopMaType === "none" ? breakevenPrice : Math.max(breakevenPrice, techBreakTriggerPrice);
          defenseLineLabel = `保本防守線 (成本+1%: ${fmtNum(breakevenPrice)}元)`;
        }

        let actionCommand = "【🟢 續抱】";
        let actionSubTag = `防守價: ${fmtNum(defenseLinePrice)} 元`;
        let actionBadgeType = "hold";
        let actionReason = "未觸發停損或移動停利條件，守穩防守底線續抱。";

        if (isHardStopTriggered) {
          actionCommand = "【🚨 觸價停損】";
          actionBadgeType = "stop_loss";
          const reasons = [];
          const shortTags = [];
          if (isFundStopTriggered) {
            reasons.push(`帳面虧損 ${fmtNum(pnlPct)}% 已達設定之 -${customLossPct}% 停損線 (${fmtNum(hardStopPriceByCost)}元)`);
            shortTags.push(`虧損達 -${customLossPct}%`);
          }
          if (isTechStopTriggered) {
            if (todayClose <= techBreakTriggerPrice) {
              reasons.push(`收盤價 (${fmtNum(todayClose)}) 跌破 ${baseMALabel} 觸發價 (${fmtNum(techBreakTriggerPrice)}元)`);
              shortTags.push(`跌破 ${baseMALabel}`);
            } else if (s.twoDaysBelowMA) {
              reasons.push(`連續兩日收盤站不回 ${baseMALabel} (${fmtNum(baseMA)}元)`);
              shortTags.push(`連2日破 ${baseMALabel}`);
            }
          }
          actionSubTag = `原因：${shortTags.join(" + ")}${!isFundStopTriggered && isTechStopTriggered ? ` (若只想看-${customLossPct}%請選「純看%數」)` : ""}`;
          actionReason = `強制砍單：${reasons.join(" ＋ ")}。${!isFundStopTriggered && isTechStopTriggered ? `💡 提醒：您的虧損 (${fmtNum(pnlPct)}%) 尚未達 -${customLossPct}%，本次是因為「跌破 ${baseMALabel}」而觸發技術面停損！若您只想以買入價 -${customLossPct}% 為唯一標準，請將停損規則改為「純看%數(不看均線)」。` : "觸及資金停損底線，拒絕凹單！"}`;
        } else if (isTrailingTriggered) {
          actionCommand = "【💰 減碼停利】";
          actionBadgeType = "take_profit";
          actionSubTag = `高點回落 ${fmtNum(drawdownFromPeakPct, 1)}%`;
          actionReason = `移動停利觸發：自期間最高價 ${fmtNum(updatedHigh)} 回落達 ${fmtNum(drawdownFromPeakPct)}% (>=5%)，強制鎖住波段獲利！`;
        } else if (isBreakevenTriggered) {
          actionCommand = "【💰 保本停利】";
          actionBadgeType = "take_profit";
          actionSubTag = `跌破保本線 (${fmtNum(breakevenPrice)}元)`;
          actionReason = `曾獲利達 +${fmtNum(peakGainPct)}% (超過+8%啟動保本保護)，現跌破成本+1%保本線 (${fmtNum(breakevenPrice)}元)，嚴禁由盈轉虧！`;
        } else if (isChipVetoTriggered) {
          actionCommand = "【⚠️ 逢高減碼/避險】";
          actionBadgeType = "chip_veto";
          actionSubTag = "原因：籌碼敗壞一票否決";
          actionReason = `籌碼敗壞一票否決：出現融資暴增+法人大賣或隔日沖鎖漲停，隔日早盤強制逢高減碼避險！`;
        }

        let chipScore = 0;
        const cd = s.chipDetails;
        if (cd && cd.concentration) {
          if (cd.instSummary?.total5d > 0 && cd.instSummary?.total20d > 0) chipScore += 1.2;
          else if (cd.instSummary?.total1d > 0 || cd.instSummary?.total5d > 0) chipScore += 0.8;
          chipScore += Math.min(1.2, (cd.concentration.passCount || 0) * 0.35);
          if (cd.majorHolders?.is3WeeksUp && cd.majorHolders?.isRetailDown) chipScore += 1.0;
          else if (cd.majorHolders?.weeklyList?.[0]?.diff400Pct > 0) chipScore += 0.6;
          if (cd.marginSblSummary?.marginDiff20d <= 0) chipScore += 0.6;
        } else {
          if (s.chipForeignTrustBuy) chipScore += 2.0;
          if (s.chipMarginDownShortUp) chipScore += 1.0;
          if (s.chipNoDayTrader) chipScore += 1.0;
        }
        chipScore = Math.min(4.0, Number(chipScore.toFixed(1)));
        if (s.vetoMarginSpikeForeignSell) chipScore = Math.max(0, Number((chipScore - 2.0).toFixed(1)));
        if (s.vetoDayTraderLockLimitUp) chipScore = Math.max(0, Number((chipScore - 1.0).toFixed(1)));

        let techScore = 0;
        const refMA = baseMA > 0 ? baseMA : ma20;
        if (s.maBullishAlign && todayClose >= refMA) techScore += 1.5;
        if (s.priceVolGood) techScore += 1.5;
        if (isTechStopTriggered) techScore = 0;
        else if (todayClose < refMA) techScore = Math.max(0, techScore - 1.5);

        const fundScore = s.fundRevGrowthTheme ? 2.0 : 0.5;
        const sectorScore = s.sectorHotFocus ? 1.0 : 0.0;
        const totalScore = Number((chipScore + techScore + fundScore + sectorScore).toFixed(1));

        return {
          ...s,
          ma5,
          ma10,
          ma20,
          ma60,
          customLossPct,
          stopMaType,
          stopLogicMode,
          maBufferPct,
          hardStopPriceByCost,
          updatedHigh,
          pnlPct,
          peakGainPct,
          drawdownFromPeakPct,
          totalCostAmt,
          marketValueAmt,
          unrealizedPnL,
          baseMA,
          baseMALabel,
          techBreakTriggerPrice,
          defaultHardStopPrice,
          trailingStopPrice,
          breakevenPrice,
          defenseLinePrice,
          defenseLineLabel,
          isTrailingActive,
          isBreakevenActive,
          isFundStopTriggered,
          isTechStopTriggered,
          isHardStopTriggered,
          isTrailingTriggered,
          isBreakevenTriggered,
          isChipVetoTriggered,
          actionCommand,
          actionSubTag,
          actionBadgeType,
          actionReason,
          chipScore,
          techScore,
          fundScore,
          sectorScore,
          totalScore
        };
      };

      const evaluatedStocks = useMemo(() => {
        return stocks.map((rawItem, idx) => evaluateSingleStock(rawItem, idx));
      }, [stocks]);

      const evaluatedLookupStock = useMemo(() => {
        if (!lookupStock) return null;
        return evaluateSingleStock(lookupStock, 999);
      }, [lookupStock]);

      const filteredStocks = useMemo(() => {
        if (activeAccountId === "ALL") return evaluatedStocks;
        return evaluatedStocks.filter(s => s.accountId === activeAccountId);
      }, [evaluatedStocks, activeAccountId]);

      const accountSummary = useMemo(() => {
        const totalCost = filteredStocks.reduce((acc, s) => acc + safeNum(s.totalCostAmt, 0), 0);
        const totalMarketVal = filteredStocks.reduce((acc, s) => acc + safeNum(s.marketValueAmt, 0), 0);
        const totalPnL = totalMarketVal - totalCost;
        const totalPnLPct = totalCost > 0 ? (totalPnL / totalCost) * 100 : 0;
        const stopLossCount = filteredStocks.filter(s => s.actionBadgeType === "stop_loss").length;
        return {
          count: filteredStocks.length,
          totalCost,
          totalMarketVal,
          totalPnL,
          totalPnLPct,
          stopLossCount
        };
      }, [filteredStocks]);

      const selectedStock = useMemo(() => {
        if (inspectMode === "lookup" && evaluatedLookupStock) {
          return evaluatedLookupStock;
        }
        return filteredStocks.find(s => s.id === selectedStockId) || evaluatedStocks.find(s => s.id === selectedStockId) || filteredStocks[0] || evaluatedStocks[0] || null;
      }, [inspectMode, evaluatedLookupStock, filteredStocks, evaluatedStocks, selectedStockId]);

      useEffect(() => {
        if (!selectedStock) return;
        const hasChip = Boolean(selectedStock.chipDetails && selectedStock.chipDetails.concentration);
        if (!hasChip && !fetchingIds[selectedStock.id] && !autoFetchedRef.current[selectedStock.id]) {
          autoFetchedRef.current[selectedStock.id] = true;
          handleSyncSingleStock(selectedStock, null);
        }
      }, [selectedStock?.id]);

      const stateSnapshotCode = useMemo(() => {
        const itemsStr = evaluatedStocks
          .map(s => `{帳號:${getAccountName(s.accountId)}, ${s.code}_${s.name}, 張數:${s.lots}, 成本:${fmtNum(s.avgCost)}, 期間最高:${fmtNum(s.updatedHigh)}, 屬性:${s.mode === "short" ? "短線" : "波段"}, 停損:-${s.customLossPct}%/${s.stopMaType.toUpperCase()}/${s.stopLogicMode.toUpperCase()}}`)
          .join(", ");
        return `[狀態更新] 日期: ${todayDateStr} | 庫存: ${itemsStr}`;
      }, [evaluatedStocks, accounts, todayDateStr]);

      const handleParseSnapshot = async () => {
        if (!snapshotInput.trim()) return alert("請先在輸入框貼上 [狀態更新] 記憶碼！");
        const regex = /\{(?:帳號:([^,]+),\s*)?([^_,\s]+)_([^,\s]+),\s*張數:([\d.]+),\s*成本:([\d.]+),\s*期間最高:([\d.]+),\s*屬性:(波段|短線)(?:,\s*停損:-?([\d.]+)%\/([A-Za-z0-9]+)(?:\/([A-Za-z]+))?)?\}/g;
        const matches = [...snapshotInput.matchAll(regex)];
        if (matches.length === 0) return alert("⚠️ 格式解析失敗！");

        const nextAccList = [...accounts];
        const findOrCreateAccId = (accNameRaw) => {
          if (!accNameRaw) return nextAccList[0]?.id || "acc_main";
          const cleanAccName = accNameRaw.trim();
          const existing = nextAccList.find(a => a.name === cleanAccName);
          if (existing) return existing.id;
          const newId = "acc_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
          nextAccList.push({ id: newId, name: cleanAccName });
          return newId;
        };

        const parsedList = matches.map((m, idx) => {
          const [, accName, code, rawName, lotsStr, costStr, highStr, modeStr, customPctStr, maTypeStr, logicStr] = m;
          const cleanCode = code.trim().toUpperCase();
          const isShort = modeStr === "短線";
          const correctName = BUILTIN_STOCK_DIR[cleanCode] || stockDict[cleanCode] || rawName.trim();
          const accId = findOrCreateAccId(accName);

          return normalizeStockItem({
            id: `${cleanCode}_${Date.now()}_${idx}`,
            accountId: accId,
            code: cleanCode,
            name: correctName,
            lots: parseFloat(lotsStr),
            avgCost: parseFloat(costStr),
            prevHigh: parseFloat(highStr),
            mode: isShort ? "short" : "swing",
            stopLossPct: customPctStr ? parseFloat(customPctStr) : (isShort ? 5.0 : 10.0),
            stopMaType: maTypeStr ? maTypeStr.toLowerCase() : "none",
            stopLogicMode: logicStr ? logicStr.toLowerCase() : "or"
          }, idx);
        });

        setAccounts(nextAccList);
        setStocks(parsedList);
        setSelectedStockId(parsedList[0].id);
        setInspectMode("portfolio");
        setSnapshotInput("");
        setSyncBannerMsg(`✅ 已成功還原 ${parsedList.length} 檔庫存，正在自動聯網同步大數據籌碼與四大財報...`);

        setIsSyncingAll(true);
        const syncedList = [];
        for (const item of parsedList) {
          const updated = await fetchSingleStockMarketData(item);
          syncedList.push(updated);
        }
        setStocks(syncedList);
        setIsSyncingAll(false);
        setSyncBannerMsg(`✅ 記憶碼還原並完成 ${syncedList.length} 檔最新盤後行情與籌碼財報同步！`);
      };

      const updateSelectedStockField = (field, value) => {
        if (!selectedStock) return;
        if (inspectMode === "lookup" && lookupStock) {

      const updateStockRuleById = (id, field, value) => {

      };

      const fullMarkdownReport = useMemo(() => {
        const titleScope = activeAccountId === "ALL" ? "全部帳號總覽" : getAccountName(activeAccountId);
        const rows = filteredStocks
          .map(s => `| ${getAccountName(s.accountId)} | ${s.code} ${s.name} | ${s.lots} | ${fmtNum(s.avgCost)} | ${fmtNum(s.todayClose)} | ${fmtNum(s.updatedHigh)} | ${s.pnlPct >= 0 ? "+" : ""}${fmtNum(s.pnlPct)}% | ${fmtNum(s.defenseLinePrice)} (${s.defenseLineLabel}) | **${s.actionCommand}** (${s.actionSubTag}) |`)
          .join("\n");

        const diagSections = filteredStocks.map(s => {
          const newsMd = (s.newsItems || []).map(n => `    - [${n.title}](${n.link}) (${n.pubDate})`).join("\n");
          return `### 【${getAccountName(s.accountId)}｜${s.code} ${s.name}】— 多空總評分：${fmtNum(s.totalScore, 1)} / 10 分
- **📊 籌碼面大數據透視**：
  * **三大法人(近一月)**：${s.institutionalNote}
  * **籌碼集中度與千張大戶**：${s.branchNote}
  * **融資融券與借券賣出**：${s.marginNote}
- **📈 技術面結構**：今日收盤 ${fmtNum(s.todayClose)} 元 | 5MA: ${fmtNum(s.ma5)} | 10MA: ${fmtNum(s.ma10)} | 20MA(月線): ${fmtNum(s.ma20)} | 60MA(季線): ${fmtNum(s.ma60)}
- **📰 基本面、財報四大維度與消息解讀**：
  * **① 近一年每月營收**：${s.revenueNote}
  * **② 近兩年季財報與毛利率/業外占比**：${s.epsNote}
  * **③ 庫存(存貨)與合約負債**：${s.balanceNote}
  * **④ 最新相關新聞**：\n${newsMd || "    - 尚無新聞"}

#### ⚡ 【${s.code} ${s.name}】冷酷風控官的明日操作劇本
- **🧠 紀律當頭棒喝**：${s.actionReason}`;
        }).join("\n\n---\n\n");

        return `---

| 帳號分類 | 股號/名稱 | 張數 | 平均成本 | 今日收盤 | 期間最高價 | 帳面損益(%) | 目前防守底線 (觸發價) | 系統強制指令 |
| :--- | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :--- |
${rows}

## 🔍 二、 個股四維度深度診斷 & ⚡ 三、 明日操作劇本
${diagSections}

## 💾 四、 系統狀態記憶碼 (State Snapshot)
\`${stateSnapshotCode}\`
---`;
      }, [filteredStocks, activeAccountId, accounts, stateSnapshotCode]);

      const getPnLColor = (val) => {
        if (val === null || val === undefined || !Number.isFinite(Number(val))) return "text-slate-400";
        if (val > 0) return colorStyle === "tw" ? "text-rose-400" : "text-emerald-400";
        if (val < 0) return colorStyle === "tw" ? "text-emerald-400" : "text-rose-400";
        return "text-slate-300";
      };

      const getCommandBadgeStyle = (type) => {
        switch (type) {
          case "stop_loss":
            return "bg-rose-950/90 text-rose-300 border-rose-500 font-black animate-pulse shadow-lg shadow-rose-950/50";
          case "take_profit":
            return "bg-amber-950/80 text-amber-300 border-amber-500 font-bold";
          case "chip_veto":
            return "bg-orange-950/80 text-orange-300 border-orange-500 font-bold";
          default:
            return "bg-emerald-950/60 text-emerald-300 border-emerald-500/40 font-semibold";
        }
      };

      const handleCopyText = (text, type) => {
        navigator.clipboard.writeText(text);
        setCopiedType(type);
        setTimeout(() => setCopiedType(null), 2000);
      };

      const selMonthlyList = selectedStock?.financialDetails?.monthlyRevenues || [];
      const selQuarterlyList = selectedStock?.financialDetails?.quarterlyStats || [];
      const selChip = selectedStock?.chipDetails || null;
      const isSelectedETF = Boolean(selectedStock?.code?.startsWith("00"));

      return (
        <div className="max-w-[1440px] mx-auto p-3 md:p-6 space-y-5">
          {/* 頂部 Header */}
          <header className="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 md:p-5 shadow-2xl space-y-4">
            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
              <div>
                <div className="flex flex-wrap items-center gap-2.5">

                  <span>🔎 個股查詢資料</span>

                  <button

            {/* 👥 簡易帳號 / 投資組合分類切換列 */}
            <div className="pt-3 border-t border-slate-800/80 flex flex-col gap-3">
              <div className="flex flex-wrap items-center justify-between gap-2">
                <div className="flex flex-wrap items-center gap-2">
                  <span className="text-xs font-bold text-slate-400 mr-1">👥 帳號分類：</span>

                  <button
                    onClick={() => {
                      setActiveAccountId("ALL");
                      setInspectMode("portfolio");
                    }}
                    className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border ${
                      activeAccountId === "ALL" && inspectMode === "portfolio"
                        ? "bg-amber-500 text-slate-950 border-amber-400 shadow-lg shadow-amber-950/50"
                        : "bg-slate-950 text-slate-300 border-slate-800 hover:border-slate-700"
                    }`}
                  >
                    <span>🌐 全部帳號總覽</span>
                    <span className={`px-1.5 py-0.2 rounded-full text-[10px] ${activeAccountId === "ALL" ? "bg-slate-950 text-amber-300" : "bg-slate-800 text-slate-400"}`}>
                      {evaluatedStocks.length}
                    </span>
                  </button>

                  {accounts.map(acc => {
                    const count = evaluatedStocks.filter(s => s.accountId === acc.id).length;
                    const isActive = activeAccountId === acc.id && inspectMode === "portfolio";
                    return (

                        className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border ${

                      >

                  <button

                  >

                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setActiveTab(prev => (prev === "dashboard" ? "markdown" : "dashboard"))}

                  </button>
                  <button

                                            </td>
                                            <td className="p-2 text-center font-sans">
                                              {q.nonOpRatioPct === null ? "-" : Math.abs(q.nonOpRatioPct) <= 15 ? (
                                                <span className="text-emerald-400">✅ 本業純度高</span>
                                              ) : q.nonOpRatioPct > 25 ? (
                                                <span className="text-amber-300">⚠️ 業外偏高</span>
                                              ) : (
                                                <span className="text-slate-300">正常</span>
                                              )}
                                            </td>
                                          </tr>
                                        );
                                      })}
                                    </tbody>
                                  </table>
                                </div>
                              </>
                            ) : (
                              <div className="p-6 text-center text-slate-500">
                                點擊「🔄 刷新此股籌碼與財報」即可聯網抓取毛利率與業外占比明細！
                              </div>
                            )}
                          </div>
                        )}

                        {/* 財報 ④：庫存 (存貨) 與 合約負債追蹤表 */}
                        {(finSubTab === "all" || finSubTab === "balance") && (
                          <div className="bg-slate-950/90 border border-slate-800 rounded-xl p-4 space-y-3">
                            <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                              <span className="font-bold text-purple-300">④ 庫存 (存貨) 與 合約負債 (在手訂單領先指標)</span>
                              <span className="text-[11px] text-slate-400">單位：億元新台幣</span>
                            </div>

                            {selQuarterlyList.length > 0 ? (
                              <>
                                <div className="p-2.5 bg-slate-900 border border-purple-500/30 rounded-lg text-[11px] text-slate-200 flex flex-wrap items-center justify-between gap-2">
                                  <div>
                                    <span className="text-purple-300 font-bold">最新存貨 ({selQuarterlyList[0].qLabel})：</span>
                                    <b className="font-mono text-white">{selQuarterlyList[0].invB !== null ? `${selQuarterlyList[0].invB} 億` : "無"}</b>
                                  </div>
                                  <div>
                                    <span className="text-amber-300 font-bold">最新合約負債：</span>
                                    <b className="font-mono text-white">{selQuarterlyList[0].contractLiabB !== null ? `${selQuarterlyList[0].contractLiabB} 億` : "無"}</b>
                                  </div>
                                </div>

                                <div className="overflow-x-auto max-h-60">
                                  <table className="w-full text-left text-[11px] font-mono">
                                    <thead className="bg-slate-900 text-slate-400 sticky top-0">
                                      <tr>
                                        <th className="p-2">季度</th>
                                        <th className="p-2 text-right">存貨/庫存(億)</th>
                                        <th className="p-2 text-right">庫存季增(QoQ)</th>
                                        <th className="p-2 text-right">庫存年增(YoY)</th>
                                        <th className="p-2 text-right">合約負債(億)</th>
                                        <th className="p-2 text-right">合約負債季增</th>
                                        <th className="p-2 text-right">合約負債年增</th>
                                      </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800/70">
                                      {selQuarterlyList.map((q, idx) => (
                                        <tr key={idx} className={idx === 0 ? "bg-purple-950/20 font-bold" : ""}>
                                          <td className="p-2 text-slate-200">{q.qLabel}</td>
                                          <td className="p-2 text-right text-white">{q.invB !== null ? q.invB.toFixed(2) : "-"}</td>
                                          <td className={`p-2 text-right ${getPnLColor(q.invQoQ)}`}>{fmtSignNum(q.invQoQ, 1)}</td>
                                          <td className={`p-2 text-right ${getPnLColor(q.invYoY)}`}>{fmtSignNum(q.invYoY, 1)}</td>
                                          <td className="p-2 text-right text-amber-300">{q.contractLiabB !== null ? q.contractLiabB.toFixed(2) : "-"}</td>
                                          <td className={`p-2 text-right ${getPnLColor(q.clQoQ)}`}>{fmtSignNum(q.clQoQ, 1)}</td>
                                          <td className={`p-2 text-right ${getPnLColor(q.clYoY)}`}>{fmtSignNum(q.clYoY, 1)}</td>
                                        </tr>
                                      ))}
                                    </tbody>
                                  </table>
                                </div>
                              </>
                            ) : (
                              <div className="p-6 text-center text-slate-500">
                                點擊「🔄 刷新此股籌碼與財報」即可聯網抓取存貨與合約負債明細！
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </section>
              )}

              {/* ⚡ 三、冷酷風控官的明日操作劇本 */}
              {selectedStock && (
                <section className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl space-y-4">
                  <h2 className="text-sm md:text-base font-bold flex items-center gap-2 text-rose-300">
                    <span>⚡</span> 三、冷酷風控官的明日操作劇本 — 【{selectedStock.code} {selectedStock.name}】
                  </h2>

                  <div className="p-4 rounded-xl bg-rose-950/35 border border-rose-500/40 text-xs md:text-sm text-rose-100 leading-relaxed">
                    <strong className="text-rose-400">🧠 紀律當頭棒喝：</strong>
                    {selectedStock.actionReason}
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                    <div className="p-4 bg-slate-950/80 border border-emerald-500/30 rounded-xl space-y-1.5">
                      <div className="font-bold text-emerald-400 text-sm">🟢 強勢進攻 / 續抱條件</div>
                      <p className="text-slate-300 leading-relaxed">
                        若明日開盤守穩 5MA (<span className="font-mono font-bold text-emerald-300">{fmtNum(selectedStock.ma5)} 元</span>) 且帶量突破今日高點 <span className="font-mono font-bold text-emerald-300">{fmtNum(selectedStock.todayHigh)} 元</span>，代表多方動能延續，紀律續抱讓獲利奔跑。
                      </p>
                    </div>

                    <div className="p-4 bg-slate-950/80 border border-amber-500/30 rounded-xl space-y-1.5">
                      <div className="font-bold text-amber-300 text-sm">🟡 逢高調節 / 停利條件</div>
                      <p className="text-slate-300 leading-relaxed">
                        若明日衝高至 <span className="font-mono font-bold text-amber-300">{fmtNum(Math.max(selectedStock.updatedHigh, selectedStock.todayClose * 1.03))} 元</span> 附近出現爆量長上影線或隔日沖大舉出貨，強制逢高減碼 1/3 ~ 1/2 鎖住實質獲利。
                      </p>
                    </div>

                    <div className="p-4 bg-slate-950/80 border border-rose-500/40 rounded-xl space-y-1.5">
                      <div className="font-bold text-rose-400 text-sm">🔴 鐵血停損 / 清倉條件</div>
                      <p className="text-slate-200 leading-relaxed">
                        若盤中或收盤跌破目前防守底線 <span className="font-mono font-black text-rose-400 underline">{fmtNum(selectedStock.defenseLinePrice)} 元</span> ({selectedStock.defenseLineLabel})，無條件市價砍單清倉，絕不留戀！
                      </p>
                    </div>
                  </div>
                </section>
              )}

              {/* ☁️ Google Sheets 跨裝置雲端同步中心 & 狀態記憶碼 */}
              <section className="bg-slate-900 border-2 border-blue-500/40 rounded-2xl p-5 shadow-2xl space-y-4">
                <div className="flex flex-wrap items-center justify-between border-b border-slate-800 pb-3 gap-2">
                  <h2 className="text-sm md:text-base font-bold text-blue-300 flex items-center gap-2">
                    <span>☁️</span> 四、Google Sheets 跨裝置雲端同步中心 & 狀態記憶碼
                  </h2>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={handleExportBackupFile}
                      className="px-3 py-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 rounded-lg text-xs font-bold text-emerald-300 transition"
                    >
                      💾 下載 .json 備份檔
                    </button>
                    <button
                      onClick={() => handleCopyText(stateSnapshotCode, "snap")}
                      className="px-3.5 py-1.5 bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 rounded-lg text-xs font-bold text-amber-300 transition"
                    >
                      {copiedType === "snap" ? "✅ 已複製狀態記憶碼！" : "📋 複製狀態記憶碼"}
                    </button>
                  </div>
                </div>

                <div className="space-y-3">
                  <p className="text-xs text-slate-400 leading-relaxed">
                    1. 您的 <b>Google Apps Script 網頁應用程式網址</b> 會自動保存在瀏覽器中，不需重複輸入。<br/>
                    2. 電腦端修改完庫存後點擊 <b>「⬆️ 上傳至雲端」</b>；手機端打開網頁點擊 <b>「⬇️ 從雲端下載」</b> 即可瞬間同步所有帳號分類、庫存明細與大數據籌碼/財報！
                  </p>

                  <input
                    type="text"
                    value={cloudUrl}
                    onChange={e => setCloudUrl(e.target.value)}
                    placeholder="請貼上您的 Google Apps Script 網址 (https://script.google.com/macros/s/.../exec)"
                    className="w-full bg-slate-950 border border-blue-500/50 rounded-lg px-3 py-2 text-xs text-blue-100 placeholder-slate-600 focus:outline-none focus:border-blue-400 font-mono"
                  />

                  <div className="flex flex-col sm:flex-row gap-3 pt-1">
                    <button
                      onClick={handlePushToCloud}
                      disabled={isCloudPushing}
                      className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-bold rounded-xl shadow-lg transition text-xs md:text-sm"
                    >
                      {isCloudPushing ? "⏳ 正在上傳至 Google 雲端..." : "⬆️ 上傳至雲端 (電腦端備份)"}
                    </button>
                    <button
                      onClick={handlePullFromCloud}
                      disabled={isCloudPulling}
                      className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold rounded-xl shadow-lg transition text-xs md:text-sm"
                    >
                      {isCloudPulling ? "⏳ 正在從 Google 雲端下載..." : "⬇️ 從雲端下載 (手機端還原)"}
                    </button>
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-800/80 space-y-2">
                  <div className="text-xs font-bold text-slate-400">💾 系統狀態記憶碼 (State Snapshot)：</div>
                  <div className="p-3 bg-slate-950 border border-slate-800 rounded-xl font-mono text-xs text-amber-200/90 break-all select-all">
                    {stateSnapshotCode}
                  </div>
                  <div className="flex flex-col sm:flex-row gap-2 pt-1">
                    <input
                      type="text"
                      value={snapshotInput}
                      onChange={e => setSnapshotInput(e.target.value)}
                      placeholder="在此貼上 [狀態更新] 記憶碼字串，點擊右側按鈕即可一鍵還原所有帳號與庫存..."
                      className="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500"
                    />
                    <button
                      onClick={handleParseSnapshot}
                      className="px-4 py-2 bg-amber-600/25 hover:bg-amber-600/40 border border-amber-500/40 text-amber-300 rounded-lg text-xs font-bold whitespace-nowrap transition"
                    >
                      📥 解析記憶碼並抓價
                    </button>
                  </div>
                </div>
              </section>
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
